                }

                // Label
                ctx.fillStyle = '#1a1a1a';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(this.label, baseX, this.y - offsetY - 10);
            }

            drawNail(x, y, angle, isFlashing) {
                const nailLength = 24;
                const handleLength = 7;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                // Handle - simple dark wrapped handle
                ctx.fillStyle = isFlashing ? '#ffffff' : '#4a4a5a';
                ctx.fillRect(-2.5, -handleLength, 5, handleLength);

                // Nail blade - simple elongated diamond/blade shape
                // The Old Nail is a simple, slightly worn pale blade
                ctx.fillStyle = isFlashing ? '#ffffff' : '#c0c0c8';
                ctx.beginPath();
                ctx.moveTo(-3.5, 0); // Left base
                ctx.lineTo(-3, nailLength * 0.6); // Left edge tapers
                ctx.lineTo(0, nailLength); // Sharp point
                ctx.lineTo(3, nailLength * 0.6); // Right edge
                ctx.lineTo(3.5, 0); // Right base
                ctx.closePath();
                ctx.fill();

                // Blade edge - subtle lighter edge on left
                if (!isFlashing) {
                    ctx.strokeStyle = '#e0e0e8';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-2.5, 2);
                    ctx.lineTo(-2, nailLength * 0.55);
                    ctx.lineTo(0, nailLength - 2);
                    ctx.stroke();
                }

                // Simple crossguard
                ctx.fillStyle = isFlashing ? '#ffffff' : '#6a6a7a';
                ctx.fillRect(-5, -1.5, 10, 3);

                ctx.restore();
            }

            handlePlatformCollision(platform) {
                // Check collision
                if (this.x < platform.x + platform.width &&
                    this.x + this.width > platform.x &&
                    this.y < platform.y + platform.height &&
                    this.y + this.height > platform.y) {

                    // Determine collision direction
                    const overlapLeft = (this.x + this.width) - platform.x;
                    const overlapRight = (platform.x + platform.width) - this.x;
                    const overlapTop = (this.y + this.height) - platform.y;
                    const overlapBottom = (platform.y + platform.height) - this.y;

                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                    if (minOverlap === overlapTop && this.vy > 0) {
                        // Landing on top
                        this.y = platform.y - this.height;
                        this.vy = 0;
                        this.onGround = true;
                        this.jumpsLeft = 2;
                        this.dashAvailable = true;

                    } else if (minOverlap === overlapBottom && this.vy < 0) {
                        // Hitting ceiling
                        this.y = platform.y + platform.height;
                        this.vy = 0;
                    } else if (minOverlap === overlapLeft && this.vx > 0) {
                        // Hitting right wall
                        this.x = platform.x - this.width;
                        if (this.dashTimer <= 0) {
                            this.vx = 0;
                            this.onWall = true;
                            this.wallDirection = -1;
                            this.jumpsLeft = 2;
                            this.dashAvailable = true;
                        }
                    } else if (minOverlap === overlapRight && this.vx < 0) {
                        // Hitting left wall
                        this.x = platform.x + platform.width;
                        if (this.dashTimer <= 0) {
                            this.vx = 0;
                            this.onWall = true;
                            this.wallDirection = 1;
                            this.jumpsLeft = 2;
                            this.dashAvailable = true;
                        }
                    }
                }
            }

            handleSpikeCollision(spike) {
                // Extended pogo hitbox to match slash width (25 pixels to each side)
                const pogoSlashWidth = 45;
                const playerCenterX = this.x + this.width / 2;
                const slashHitsSpike = (playerCenterX + pogoSlashWidth > spike.x) &&
                                       (playerCenterX - pogoSlashWidth < spike.x + spike.width) &&
                                       (this.y + this.height > spike.y - 5) &&
                                       (this.y < spike.y + spike.height);

                // Check pogo first with extended slash hitbox
                if (this.attackTimer > 0 && this.attackDirection === 1 && this.vy > 0 &&
                    this.y + this.height - this.vy <= spike.y + 10 && slashHitsSpike) {
                    // Pogo bounce off spikes with downward attack!
                    this.vy = -POGO_BOUNCE;
                    this.y = spike.y - this.height;
                    this.jumpsLeft = 1;
                    this.dashAvailable = true;
                    this.createJumpParticles();

                    // Create spark particles for hitting spikes
                    for (let i = 0; i < 10; i++) {
                        this.particles.push({
                            x: this.x + this.width / 2,
                            y: spike.y,
                            vx: (Math.random() - 0.5) * 8,
                            vy: -Math.random() * 5 - 2,
                            life: 25,
                            color: '#ffff88'
                        });
                    }
                    return; // Successfully pogoed, don't die
                }

                // Check if player body actually touches spike (death)
                if (this.x < spike.x + spike.width &&
                    this.x + this.width > spike.x &&
                    this.y < spike.y + spike.height &&
                    this.y + this.height > spike.y) {
                    this.die();
                }
            }

            handleVoidZoneCollision(voidZone) {
                if (this.x < voidZone.x + voidZone.width &&
                    this.x + this.width > voidZone.x &&
                    this.y < voidZone.y + voidZone.height &&
                    this.y + this.height > voidZone.y) {
                    // Void instantly kills - no pogo possible
                    this.die();
                }
            }

            handleCheckpoint(checkpoint) {
                if (this.x < checkpoint.x + checkpoint.width &&
                    this.x + this.width > checkpoint.x &&
                    this.y < checkpoint.y + checkpoint.height &&
                    this.y + this.height > checkpoint.y) {
                    this.checkpointX = checkpoint.x;
                    this.checkpointY = checkpoint.y - this.height - 5;
                    checkpoint.activated = true;
                    checkpoint.particleTimer = 25; // Short burst of particles
                }
            }

            handleGoal(goal) {
                if (this.x < goal.x + goal.width &&
                    this.x + this.width > goal.x &&
                    this.y < goal.y + goal.height &&
                    this.y + this.height > goal.y) {
                    if (!gameWon) {
                        gameWon = true;
                        winner = this.label;
                        showWinMessage();
                    }
                }
            }

            die() {
                const deathX = this.x + this.width / 2;
                const deathY = this.y + this.height / 2;

                // Add death animation at death location
                deathAnimations.push({
                    x: deathX,
                    y: deathY,
                    frame: 0,
                    frameTimer: 0,
                    facing: this.facing,
                    alpha: 1,
                    fading: false,
                    delayTimer: 90 // Wait 1.5 seconds (90 frames at 60fps) on first frame
                });

                this.x = this.checkpointX;
                this.y = this.checkpointY;
                this.vx = 0;
                this.vy = 0;
                this.dashTimer = 0;
                this.dashAvailable = true;

                // Hollow Knight style death - void/soul burst
                // Main void explosion
                for (let i = 0; i < 16; i++) {
                    const angle = (i / 16) * Math.PI * 2;
                    const speed = 3 + Math.random() * 3;
                    this.particles.push({
                        x: deathX,
                        y: deathY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 45,
                        color: '#1a1a2e',
                        type: 'soul'
                    });
                }
                // White mask fragments
                for (let i = 0; i < 10; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x: deathX + (Math.random() - 0.5) * 10,
                        y: deathY + (Math.random() - 0.5) * 10,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        life: 35,
                        color: this.color,
                        type: 'essence'
                    });
                }
                // Rising soul wisps
                for (let i = 0; i < 8; i++) {
                    this.particles.push({
                        x: deathX + (Math.random() - 0.5) * 20,
                        y: deathY,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 3 - 2,
                        life: 50,
                        color: '#292938',
                        type: 'soul'
                    });
                }
            }

            draw(cameraOffset = camera) {
                // Draw particles with Hollow Knight style effects
                this.particles.forEach(p => {
                    const alpha = Math.min(1, p.life / 25);
                    const px = p.x - cameraOffset.x;
                    const py = p.y - cameraOffset.y;

                    if (p.type === 'soul') {
                        // Soul/void wisps - soft circular with fade
                        const size = 3 + (1 - alpha) * 2;
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(26, 26, 46, ${alpha * 0.7})`;
                        ctx.fill();
                        // Inner brighter core
                        ctx.beginPath();
                        ctx.arc(px, py, size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(40, 40, 60, ${alpha})`;
                        ctx.fill();
                    } else if (p.type === 'essence') {
                        // White soul essence - glowing
                        const size = 2 + Math.sin(p.life * 0.3) * 1;
                        ctx.beginPath();
                        ctx.arc(px, py, size + 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                        ctx.fill();
                    } else if (p.type === 'dust') {
                        // Dust particles - small squares
                        const size = 2 + (1 - alpha) * 2;
                        ctx.fillStyle = `rgba(100, 100, 100, ${alpha * 0.6})`;
                        ctx.fillRect(px - size/2, py - size/2, size, size);
                    } else if (p.type === 'slash') {
                        // Attack slash particles
                        const size = 3 * alpha;
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fill();
                    } else {
                        // Default particles
                        ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                        ctx.fillRect(px - 2, py - 2, 4, 4);
                    }
                });

                // Draw Knight character
                this.drawKnight(cameraOffset.x, cameraOffset.y);
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                // Path of Pain style - white stone platforms
                ctx.fillStyle = '#d8d8d8';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                // Dark stone cracks/detail lines
                ctx.strokeStyle = '#4a4a4a';
                ctx.lineWidth = 1;

                // Horizontal crack lines
                if (this.height > 10) {
                    ctx.beginPath();
                    ctx.moveTo(this.x - camera.x, this.y - camera.y + this.height / 2);
                    ctx.lineTo(this.x - camera.x + this.width, this.y - camera.y + this.height / 2);
                    ctx.stroke();
                }

                // Dark border
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                // Inner shadow on top
                ctx.strokeStyle = '#a0a0a0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x - camera.x + 1, this.y - camera.y + 1);
                ctx.lineTo(this.x - camera.x + this.width - 1, this.y - camera.y + 1);
                ctx.stroke();
            }
        }

        // Spike class
        class Spike {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                // Simple gray spikes
                const spikeWidth = 15;
                const numSpikes = Math.ceil(this.width / spikeWidth);

                for (let i = 0; i < numSpikes; i++) {
                    const sx = this.x + i * spikeWidth;

                    // Gray spike fill
                    ctx.fillStyle = '#666666';
                    ctx.beginPath();
                    ctx.moveTo(sx - camera.x, this.y - camera.y + this.height);
                    ctx.lineTo(sx - camera.x + spikeWidth / 2, this.y - camera.y);
                    ctx.lineTo(sx - camera.x + spikeWidth, this.y - camera.y + this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Dark outline
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // VoidZone class - kills on contact, cannot be pogoed
        class VoidZone {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.animTime = Math.random() * Math.PI * 2;
                // Pre-generate cloud positions for consistent look
                this.clouds = [];
                for (let i = 0; i < 30; i++) {
                    this.clouds.push({
                        xOffset: Math.random(),
                        yOffset: Math.random() * 0.3,
                        speed: 0.3 + Math.random() * 0.4,
                        size: 30 + Math.random() * 50
                    });
                }
            }

            draw() {
                this.animTime += 0.02;

                // White haze - endless fall effect
                const gradient = ctx.createLinearGradient(
                    this.x - camera.x, this.y - camera.y - 40,
                    this.x - camera.x, this.y - camera.y + 80
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
                gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.4)');
                gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 1)');

                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - camera.x, this.y - camera.y - 40, this.width, this.height + 40);

                // Animated wisps/clouds drifting to create depth
                for (let i = 0; i < this.clouds.length; i++) {
                    const cloud = this.clouds[i];
                    const driftX = Math.sin(this.animTime * cloud.speed + i) * 20;
                    const px = (this.x - camera.x) + cloud.xOffset * this.width + driftX;
                    const py = (this.y - camera.y) + cloud.yOffset * 60 - 20;

                    const alpha = 0.15 + Math.sin(this.animTime * 0.5 + i) * 0.1;
                    ctx.fillStyle = `rgba(230, 235, 240, ${alpha})`;

                    ctx.beginPath();
                    ctx.ellipse(px, py, cloud.size, cloud.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Subtle floating particles falling down (parallax depth effect)
                ctx.fillStyle = 'rgba(200, 210, 220, 0.5)';
                for (let i = 0; i < 15; i++) {
                    const fallSpeed = (this.animTime * (0.5 + i * 0.1)) % 1;
                    const px = (this.x - camera.x) + ((Math.sin(i * 7) * 0.5 + 0.5) * this.width);
                    const py = (this.y - camera.y) - 30 + fallSpeed * 80;
                    const size = 1 + (i % 3);
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Checkpoint class - Hollow Knight style bench
        class Checkpoint {
            constructor(x, y) {
                this.x = x;
                this.y = y + 20; // Offset down to sit on platform
                this.width = 50;
                this.height = 40;
                this.activated = false;
                this.particles = [];
                this.particleTimer = 0; // Timer for temporary particle effect
            }

            draw() {
                const baseX = this.x - camera.x;
                const baseY = this.y - camera.y;

                // Update particle timer - burst effect
                if (this.particleTimer > 0) {
                    this.particleTimer--;
                    // Spawn multiple particles for burst effect
                    const spawnCount = this.particleTimer > 20 ? 5 : 1; // More at start
                    for (let i = 0; i < spawnCount; i++) {
                        if (Math.random() < 0.5) {
                            this.particles.push({
                                x: this.x + this.width / 2 + (Math.random() - 0.5) * 30,
                                y: this.y + 15,
                                vx: (Math.random() - 0.5) * 1.5,
                                vy: -Math.random() * 1.0 - 0.4,
                                life: 20 + Math.random() * 15,
                                size: 4 + Math.random() * 3
                            });
                        }
                    }
                }

                // Update and draw particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy -= 0.01; // Float upward
                    p.life--;

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    const alpha = Math.min(1, p.life / 30);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x - camera.x, p.y - camera.y, p.size * (p.life / 100 + 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw bench using sprite if loaded, otherwise fall back to drawn version
                if (benchSprite.loaded) {
                    // Draw the bench image
                    const imgWidth = this.width + 5;
                    const imgHeight = (benchSprite.image.height / benchSprite.image.width) * imgWidth;
                    ctx.drawImage(
                        benchSprite.image,
                        baseX - 2,
                        baseY + this.height - imgHeight,
                        imgWidth,
                        imgHeight
                    );
                } else {
                    // Fallback: drawn bench
                    const mainColor = '#5a5a6a';
                    const darkColor = '#3a3a4a';
                    const highlightColor = '#7a7a8a';

                    // Bench legs (curved)
                    ctx.fillStyle = darkColor;
                    // Left leg
                    ctx.beginPath();
                    ctx.moveTo(baseX + 8, baseY + this.height);
                    ctx.quadraticCurveTo(baseX + 5, baseY + this.height - 15, baseX + 10, baseY + this.height - 20);
                    ctx.lineTo(baseX + 14, baseY + this.height - 20);
                    ctx.quadraticCurveTo(baseX + 12, baseY + this.height - 10, baseX + 14, baseY + this.height);
                    ctx.closePath();
                    ctx.fill();
                    // Right leg
                    ctx.beginPath();
                    ctx.moveTo(baseX + this.width - 8, baseY + this.height);
                    ctx.quadraticCurveTo(baseX + this.width - 5, baseY + this.height - 15, baseX + this.width - 10, baseY + this.height - 20);
                    ctx.lineTo(baseX + this.width - 14, baseY + this.height - 20);
                    ctx.quadraticCurveTo(baseX + this.width - 12, baseY + this.height - 10, baseX + this.width - 14, baseY + this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Bench seat
                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.roundRect(baseX + 5, baseY + this.height - 25, this.width - 10, 8, 2);
                    ctx.fill();
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Seat highlight
                    ctx.strokeStyle = highlightColor;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 7, baseY + this.height - 24);
                    ctx.lineTo(baseX + this.width - 7, baseY + this.height - 24);
                    ctx.stroke();

                    // Backrest
                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 10, baseY + this.height - 23);
                    ctx.lineTo(baseX + 12, baseY + 8);
                    ctx.quadraticCurveTo(baseX + this.width / 2, baseY, baseX + this.width - 12, baseY + 8);
                    ctx.lineTo(baseX + this.width - 10, baseY + this.height - 23);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Backrest decorative curves
                    ctx.strokeStyle = highlightColor;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 15, baseY + this.height - 25);
                    ctx.quadraticCurveTo(baseX + this.width / 2, baseY + 5, baseX + this.width - 15, baseY + this.height - 25);
                    ctx.stroke();

                    // Center ornament on backrest
                    ctx.fillStyle = this.activated ? '#ffffd0' : highlightColor;
                    ctx.beginPath();
                    ctx.arc(baseX + this.width / 2, baseY + 15, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Goal class
        class Goal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 80;
                this.glow = 0;
            }

            update() {
                this.glow = (this.glow + 0.05) % (Math.PI * 2);
            }

            draw() {
                const alpha = 0.5 + Math.sin(this.glow) * 0.3;
                ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.fillRect(this.x - camera.x - 10, this.y - camera.y, this.width + 20, this.height);

                ctx.fillStyle = '#88ccff';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GOAL', this.x - camera.x + this.width / 2, this.y - camera.y + this.height / 2 + 5);
            }
        }

        // Initialize players
        const player1 = new Player(100, 400, '#e0e0e0', {
            left: 'a',
            right: 'd',
            jump: 'w',
            down: 's',
            dash: 'Shift',
            attack: 'q'
        }, 'P1');

        const player2 = new Player(150, 400, '#88ccff', {
            left: 'j',
            right: 'l',
            jump: 'i',
            down: 'k',
            dash: 'b',
            attack: 'u'
        }, 'P2');

        // Also support Space for P1 and Enter for P2
        const originalP1Jump = player1.controls.jump;
        const originalP2Jump = player2.controls.jump;

        // Procedural level generation
        let platforms = [];
        let spikes = [];
        let voidZones = [];
        let checkpoints = [];
        let goal;

        function generateLevel() {
            platforms = [];
            spikes = [];
            voidZones = [];
            checkpoints = [];

            let x = 50;
            let y = 450;
            const levelLength = 4500;
            const checkpoint1X = levelLength / 3;
            const checkpoint2X = (levelLength / 3) * 2;
            let checkpoint1Placed = false;
            let checkpoint2Placed = false;

            // Starting platform (safe zone)
            platforms.push(new Platform(x, y, 120, 30));
            x += 180;

            // Generate random challenging sections
            while (x < levelLength) {
                // Check if we should place checkpoint 1 (arena platform)
                if (!checkpoint1Placed && x >= checkpoint1X) {
                    x = generateArena(x, y, 1);
                    checkpoint1Placed = true;
                    continue;
                }

                // Check if we should place checkpoint 2 (arena platform)
                if (!checkpoint2Placed && x >= checkpoint2X) {
                    x = generateArena(x, y, 2);
                    checkpoint2Placed = true;
                    continue;
                }

                const sectionType = Math.floor(Math.random() * 12);
                const difficulty = Math.min(1, (x - 200) / levelLength); // Increases over distance

                switch (sectionType) {
                    case 0: // Spike gap jump
                        x = generateSpikeGaps(x, y, difficulty);
                        break;
                    case 1: // Wall climb section
                        const result1 = generateWallClimb(x, y, difficulty);
                        x = result1.x;
                        y = result1.y;
                        break;
                    case 2: // Pogo spike section
                        x = generatePogoSection(x, y, difficulty);
                        break;
                    case 3: // Tiny platform gauntlet
                        const result3 = generateTinyPlatforms(x, y, difficulty);
                        x = result3.x;
                        y = result3.y;
                        break;
                    case 4: // Vertical spike corridor
                        const result4 = generateSpikeCorridor(x, y, difficulty);
                        x = result4.x;
                        y = result4.y;
                        break;
                    case 5: // Dash challenge
                        x = generateDashChallenge(x, y, difficulty);
                        break;
                    case 6: // Void gap (empty space requiring dash+jump)
                        x = generateVoidGap(x, y, difficulty);
                        break;
                    case 7: // Precision pillars
                        const result7 = generatePrecisionPillars(x, y, difficulty);
                        x = result7.x;
                        y = result7.y;
                        break;
                    case 8: // Spike sandwich corridor
                        x = generateSpikeSandwich(x, y, difficulty);
                        break;
                    case 9: // Staircase of death
                        const result9 = generateDeathStaircase(x, y, difficulty);
                        x = result9.x;
                        y = result9.y;
                        break;
                    case 10: // Falling platforms (single block chain)
                        x = generateSingleBlockChain(x, y, difficulty);
                        break;
                    case 11: // Zigzag climb
                        const result11 = generateZigzagClimb(x, y, difficulty);
                        x = result11.x;
                        y = result11.y;
                        break;
                }

                // Rare rest platform (less frequent)
                if (Math.random() < 0.1) {
                    platforms.push(new Platform(x, y, 40 - difficulty * 20, 15));
                    x += 80;
                }
            }

            // Final platform and goal (same y as last platform) - large arena for fighting
            platforms.push(new Platform(x, y, 250, 30));
            goal = new Goal(x + 105, y - 80);

            // Death pit along entire level - void zone (cannot be pogoed)
            // Extended to cover far beyond level bounds to catch all falls
            voidZones.push(new VoidZone(-500, 600, levelLength + 2000, 300));
        }

        function generateSpikeGaps(startX, baseY, difficulty) {
            let x = startX;
            const numGaps = 3 + Math.floor(Math.random() * 3 + difficulty * 3);
            const y = baseY - Math.random() * 80;

            for (let i = 0; i < numGaps; i++) {
                // Tiny platform
                const platWidth = Math.max(12, 25 - difficulty * 15);
                platforms.push(new Platform(x, y + (Math.random() - 0.5) * 40, platWidth, 12));

                // Wider spike gap
                const gapWidth = 80 + Math.random() * 60 + difficulty * 50;
                spikes.push(new Spike(x + platWidth, y + 5, gapWidth, 15));

                x += platWidth + gapWidth;
            }

            // Small landing platform
            platforms.push(new Platform(x, y, 25, 15));
            return x + 100;
        }

        function generateWallClimb(startX, startY, difficulty) {
            const height = 200 + difficulty * 100;
            const width = 100 + Math.random() * 50;
            let x = startX;
            let y = startY;

            // Left wall
            platforms.push(new Platform(x, y - height, 15, height));
            // Right wall
            platforms.push(new Platform(x + width, y - height - 30, 15, height + 30));

            // Spikes at bottom
            spikes.push(new Spike(x + 20, y - 10, width - 25, 15));

            // Small platforms inside (fewer = harder)
            const numPlatforms = Math.max(1, 3 - Math.floor(difficulty * 2));
            for (let i = 0; i < numPlatforms; i++) {
                const px = x + 25 + Math.random() * (width - 50);
                const py = y - 50 - (i * height / numPlatforms);
                platforms.push(new Platform(px, py, 20, 12));
            }

            // Exit platform
            platforms.push(new Platform(x + width + 20, y - height - 30, 50, 20));

            return { x: x + width + 120, y: y - height - 30 };
        }

        function generatePogoSection(startX, baseY, difficulty) {
            let x = startX;
            const y = baseY;
            const numSpikes = 3 + Math.floor(difficulty * 3);

            // Entry platform
            platforms.push(new Platform(x, y - 50, 30, 15));
            x += 50;

            // Spike bed that must be pogoed over
            const spikeLength = numSpikes * 50;
            spikes.push(new Spike(x, y, spikeLength, 20));

            // Tiny platforms above spikes (very small and spaced out)
            for (let i = 0; i < numSpikes - 1; i++) {
                if (Math.random() < 0.6 - difficulty * 0.3) {
                    const platSize = Math.max(12, 20 - difficulty * 10);
                    platforms.push(new Platform(
                        x + 40 + i * 50 + Math.random() * 20,
                        y - 80 - Math.random() * 40,
                        platSize, 10
                    ));
                }
            }

            x += spikeLength;
            // Exit platform
            platforms.push(new Platform(x + 10, y - 30, 40, 20));

            return x + 80;
        }

        function generateTinyPlatforms(startX, startY, difficulty) {
            let x = startX;
            let y = startY;
            const numPlatforms = 4 + Math.floor(Math.random() * 3);

            // Spike floor
            spikes.push(new Spike(x - 20, startY + 80, numPlatforms * 70 + 40, 20));

            for (let i = 0; i < numPlatforms; i++) {
                const platSize = Math.max(15, 25 - difficulty * 12);
                const yOffset = Math.sin(i * 0.8) * 60;
                platforms.push(new Platform(x, y + yOffset, platSize, 12));
                x += 50 + Math.random() * 30;
            }

            // Landing platform
            platforms.push(new Platform(x, y, 50, 20));
            return { x: x + 90, y: y };
        }

        function generateSpikeCorridor(startX, startY, difficulty) {
            let x = startX;
            const corridorHeight = 150;
            const corridorLength = 200 + difficulty * 100;

            // Solid ceiling (can't pogo over)
            platforms.push(new Platform(x, startY - corridorHeight - 15, corridorLength, 20));
            // Bottom spikes
            spikes.push(new Spike(x, startY, corridorLength, 15));

            // Walls with gaps
            const numWalls = 2 + Math.floor(difficulty * 2);
            const wallSpacing = corridorLength / (numWalls + 1);

            for (let i = 0; i < numWalls; i++) {
                const wallX = x + wallSpacing * (i + 1);
                const gapY = startY - corridorHeight + 30 + Math.random() * (corridorHeight - 80);
                const gapSize = Math.max(35, 50 - difficulty * 20);

                // Wall above gap
                platforms.push(new Platform(wallX, startY - corridorHeight + 15, 15, gapY - (startY - corridorHeight + 15)));
                // Wall below gap
                platforms.push(new Platform(wallX, gapY + gapSize, 15, startY - (gapY + gapSize)));
            }

            // Entry and exit platforms
            platforms.push(new Platform(x - 40, startY - corridorHeight / 2 - 10, 35, 15));
            platforms.push(new Platform(x + corridorLength + 10, startY - corridorHeight / 2 - 10, 50, 20));

            return { x: x + corridorLength + 100, y: startY - corridorHeight / 2 - 10 };
        }

        function generateDashChallenge(startX, baseY, difficulty) {
            let x = startX;
            const y = baseY - 30;
            const numGaps = 3 + Math.floor(difficulty * 3);

            for (let i = 0; i < numGaps; i++) {
                // Tiny platform
                const platWidth = Math.max(15, 22 - difficulty * 10);
                platforms.push(new Platform(x, y - i * 25, platWidth, 12));

                // Very long gap (requires dash + good timing)
                const gapWidth = 140 + Math.random() * 80 + difficulty * 60;
                // No spikes - pure void
                x += platWidth + gapWidth;
            }

            // Small final platform
            platforms.push(new Platform(x, y - numGaps * 25, 30, 15));
            return x + 120;
        }

        // NEW OBSTACLE: Void gap - empty space requiring dash+jump combo
        function generateVoidGap(startX, baseY, difficulty) {
            let x = startX;
            const y = baseY;

            // Starting platform
            const startWidth = Math.max(20, 35 - difficulty * 15);
            platforms.push(new Platform(x, y, startWidth, 15));
            x += startWidth;

            // Massive void gap - no spikes, just empty space
            const voidWidth = 180 + Math.random() * 100 + difficulty * 80;
            x += voidWidth;

            // Tiny landing platform
            const endWidth = Math.max(15, 25 - difficulty * 12);
            platforms.push(new Platform(x, y - 20 + Math.random() * 40, endWidth, 12));

            return x + endWidth + 80;
        }

        // NEW OBSTACLE: Precision pillars - single block width platforms at varying heights
        function generatePrecisionPillars(startX, startY, difficulty) {
            let x = startX;
            let y = startY;
            const numPillars = 5 + Math.floor(Math.random() * 4 + difficulty * 3);

            for (let i = 0; i < numPillars; i++) {
                // Single block platform (very small)
                const platWidth = Math.max(10, 18 - difficulty * 8);
                const yOffset = Math.sin(i * 1.2) * 80 + (Math.random() - 0.5) * 40;
                platforms.push(new Platform(x, y + yOffset, platWidth, 10));

                // Variable gap - sometimes needs dash
                const gap = 70 + Math.random() * 50 + difficulty * 40;
                x += platWidth + gap;
            }

            // Landing platform
            platforms.push(new Platform(x, y, 35, 15));
            return { x: x + 100, y: y };
        }

        // NEW OBSTACLE: Spike sandwich - tight corridor with ceiling and spikes below
        function generateSpikeSandwich(startX, baseY, difficulty) {
            let x = startX;
            const y = baseY - 60;
            const corridorLength = 250 + difficulty * 150;
            const corridorHeight = Math.max(50, 70 - difficulty * 25);

            // Entry platform
            platforms.push(new Platform(x - 30, y + corridorHeight / 2 - 8, 25, 12));

            // Solid ceiling (can't pogo through)
            platforms.push(new Platform(x, y - 20, corridorLength, 20));
            // Bottom spikes (floor)
            spikes.push(new Spike(x, y + corridorHeight, corridorLength, 15));

            // Tiny platforms inside the corridor
            const numPlats = 3 + Math.floor(difficulty * 2);
            for (let i = 0; i < numPlats; i++) {
                const px = x + 40 + i * (corridorLength / (numPlats + 1));
                const py = y + 10 + Math.random() * (corridorHeight - 30);
                platforms.push(new Platform(px, py, Math.max(12, 20 - difficulty * 8), 10));
            }

            // Exit platform
            platforms.push(new Platform(x + corridorLength + 10, y + corridorHeight / 2 - 8, 30, 15));

            return x + corridorLength + 120;
        }

        // NEW OBSTACLE: Death staircase - ascending with spikes on missed platforms
        function generateDeathStaircase(startX, startY, difficulty) {
            let x = startX;
            let y = startY;
            const numSteps = 6 + Math.floor(Math.random() * 4 + difficulty * 3);
            const stepHeight = 45 + difficulty * 15;
            const stepGap = 60 + difficulty * 30;

            for (let i = 0; i < numSteps; i++) {
                // Tiny step platform
                const platWidth = Math.max(12, 22 - difficulty * 10);
                platforms.push(new Platform(x, y, platWidth, 10));

                // Spikes below each platform (death if you fall)
                if (i > 0) {
                    spikes.push(new Spike(x - 20, y + 30, platWidth + 40, 15));
                }

                x += stepGap + Math.random() * 30;
                y -= stepHeight;
            }

            // Landing platform at top
            platforms.push(new Platform(x, y, 40, 15));
            return { x: x + 100, y: y };
        }

        // NEW OBSTACLE: Single block chain - super precise platforming
        function generateSingleBlockChain(startX, baseY, difficulty) {
            let x = startX;
            const y = baseY;
            const numBlocks = 6 + Math.floor(Math.random() * 5 + difficulty * 4);

            // Spike floor under entire section
            spikes.push(new Spike(x - 20, y + 60, numBlocks * 90 + 40, 20));

            for (let i = 0; i < numBlocks; i++) {
                // Single block - minimum size
                const platWidth = Math.max(10, 15 - difficulty * 5);
                const yOffset = Math.sin(i * 0.9) * 50 + Math.cos(i * 1.3) * 30;
                platforms.push(new Platform(x, y + yOffset, platWidth, 8));

                // Big gaps requiring precision
                x += platWidth + 65 + Math.random() * 40 + difficulty * 25;
            }

            // Small exit platform
            platforms.push(new Platform(x, y - 20, 30, 15));
            return x + 100;
        }

        // NEW OBSTACLE: Zigzag climb - wall jumping between spike walls
        function generateZigzagClimb(startX, startY, difficulty) {
            let x = startX;
            let y = startY;
            const height = 250 + difficulty * 100;
            const width = 80 + Math.random() * 40;
            const numLevels = 4 + Math.floor(difficulty * 2);

            // Left wall with spike sections
            for (let i = 0; i < numLevels; i++) {
                const levelY = y - (i * height / numLevels);
                const hasSpikes = i % 2 === 0;
                if (hasSpikes) {
                    // Spike section on wall
                    spikes.push(new Spike(x - 5, levelY - height / numLevels, 15, height / numLevels - 20));
                } else {
                    // Safe wall section
                    platforms.push(new Platform(x, levelY - height / numLevels, 12, height / numLevels - 15));
                }
            }

            // Right wall with alternating pattern
            for (let i = 0; i < numLevels; i++) {
                const levelY = y - (i * height / numLevels);
                const hasSpikes = i % 2 === 1;
                if (hasSpikes) {
                    spikes.push(new Spike(x + width - 5, levelY - height / numLevels, 15, height / numLevels - 20));
                } else {
                    platforms.push(new Platform(x + width - 12, levelY - height / numLevels, 12, height / numLevels - 15));
                }
            }

            // Small platforms for resting
            for (let i = 1; i < numLevels; i++) {
                const levelY = y - (i * height / numLevels) + 20;
                const side = i % 2 === 0 ? x + 15 : x + width - 35;
                if (Math.random() < 0.5 - difficulty * 0.2) {
                    platforms.push(new Platform(side, levelY, 18, 10));
                }
            }

            // Exit platform
            platforms.push(new Platform(x + width + 15, y - height - 20, 40, 15));

            return { x: x + width + 100, y: y - height - 20 };
        }

        // Arena platform with checkpoint for fighting
        function generateArena(startX, baseY, checkpointNum) {
            const voidBefore = 150; // Empty space before arena
            const x = startX + voidBefore;
            const y = baseY;
            const arenaWidth = 300;
            const arenaHeight = 30;
            const voidAfter = 150; // Empty space after arena

            // Large flat arena platform - isolated in the void
            platforms.push(new Platform(x, y, arenaWidth, arenaHeight));

            // Small elevated platforms for tactical advantage
            platforms.push(new Platform(x + 60, y - 50, 50, 12));
            platforms.push(new Platform(x + arenaWidth - 110, y - 50, 50, 12));

            // Checkpoint in the center
            const checkpoint = new Checkpoint(x + arenaWidth / 2 - 15, y - 60);
            checkpoints.push(checkpoint);

            // Return position after the void gap (no platforms to save yourself)
            return x + arenaWidth + voidAfter;
        }

        // Generate initial level
        generateLevel();

        // Input handling
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            keys[e.key] = true;

            // Prevent default for game keys
            if (['w', 'a', 's', 'd', 'q', ' ', 'Shift', 'i', 'j', 'k', 'l', 'u', '/'].includes(e.key)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.key] = false;
        });

        // Support both Space and W for P1, Enter and ArrowUp for P2
        function isJumpPressed(player) {
            if (player === player1) {
                return keys['w'] || keys[' '];
            } else {
                return keys['ArrowUp'] || keys['Enter'];
            }
        }

        // Update cameras - split screen
        function updateCamera() {
            // Camera 1 follows player 1
            camera1.x = player1.x - canvas.width / 4; // Center in left half (600px / 2 = 300)
            camera1.y = player1.y - canvas.height / 2;

            // Camera 2 follows player 2
            camera2.x = player2.x - canvas.width / 4; // Center in right half
            camera2.y = player2.y - canvas.height / 2;

            // Clamp cameras - allow following player high into the sky
            camera1.x = Math.max(0, camera1.x);
            camera1.y = Math.max(-2000, Math.min(camera1.y, 400));

            camera2.x = Math.max(0, camera2.x);
            camera2.y = Math.max(-2000, Math.min(camera2.y, 400));
        }

        // Update UI
        function updateUI() {
            document.getElementById('p1dash').textContent = player1.dashAvailable ? 'Ready' : 'Used';
            document.getElementById('p2dash').textContent = player2.dashAvailable ? 'Ready' : 'Used';
        }

        // Show win message
        function showWinMessage() {
            document.getElementById('winText').textContent = `${winner} WINS!`;
            document.getElementById('winMessage').style.display = 'block';
        }

        // Restart game
        function restartGame() {
            gameWon = false;
            winner = null;
            document.getElementById('winMessage').style.display = 'none';

            // Generate new random level
            generateLevel();

            player1.x = 100;
            player1.y = 400;
            player1.vx = 0;
            player1.vy = 0;
            player1.checkpointX = 100;
            player1.checkpointY = 400;
            player1.dashAvailable = true;
            player1.particles = [];
            player1.knockbackFrames = 0;

            player2.x = 150;
            player2.y = 400;
            player2.vx = 0;
            player2.vy = 0;
            player2.checkpointX = 150;
            player2.checkpointY = 400;
            player2.dashAvailable = true;
            player2.particles = [];
            player2.knockbackFrames = 0;

            camera1.x = 0;
            camera1.y = 0;
            camera2.x = 0;
            camera2.y = 0;

            // Reset checkpoints
            checkpoints.forEach(c => c.activated = false);
        }

        // Render the game world with a specific camera
        function renderWorld(cam) {
            // Temporarily set global camera for legacy draw methods
            const oldCamera = camera;
            camera = cam;

            // Draw subtle grid (Path of Pain style - light background)
            ctx.strokeStyle = '#d4d0c8';
            ctx.lineWidth = 1;
            for (let x = 0; x < 3000; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x - cam.x, 0);
                ctx.lineTo(x - cam.x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < 800; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y - cam.y);
                ctx.lineTo(canvas.width, y - cam.y);
                ctx.stroke();
            }

            voidZones.forEach(v => v.draw());
            platforms.forEach(p => p.draw());
            spikes.forEach(s => s.draw());
            checkpoints.forEach(c => c.draw());
            goal.draw();
            player1.draw(cam);
            player2.draw(cam);

            // Draw and update death animations
            for (let i = deathAnimations.length - 1; i >= 0; i--) {
                const anim = deathAnimations[i];

                // Draw death animation if sprite sheet is loaded
                if (spriteSheet.loaded) {
                    const deathAnim = spriteSheet.animations.death;
                    const frame = spriteSheet.getFrame('death', anim.frame);

                    ctx.save();
                    ctx.globalAlpha = anim.alpha;
                    ctx.translate(anim.x - cam.x, anim.y - cam.y);
                    ctx.scale(anim.facing, 1);
                    ctx.drawImage(
                        spriteSheet.image,
                        frame.x, frame.y, frame.width, frame.height,
                        -frame.width / 4, -frame.height / 4,
                        frame.width / 2, frame.height / 2
                    );
                    ctx.restore();

                    // Handle fading on last frame
                    if (anim.fading) {
                        anim.alpha -= 0.03;
                        if (anim.alpha <= 0) {
                            deathAnimations.splice(i, 1);
                        }
                    } else if (anim.delayTimer > 0) {
                        // Loop through first 4 frames during delay
                        anim.delayTimer--;
                        anim.frameTimer++;
                        if (anim.frameTimer >= 16) {
                            anim.frameTimer = 0;
                            anim.frame = (anim.frame + 1) % 4; // Cycle through frames 0-3
                        }
                    } else {
                        // Reset to frame 4 to continue animation after delay
                        if (anim.frame < 4) anim.frame = 4;
                        // Update animation frame
                        anim.frameTimer++;
                        if (anim.frameTimer >= 16) { // Change frame every 18 game frames
                            anim.frameTimer = 0;
                            anim.frame++;

                            // Start fading on last frame
                            if (anim.frame >= deathAnim.frames - 1) {
                                anim.frame = deathAnim.frames - 1;
                                anim.fading = true;
                            }
                        }
                    }
                } else {
                    // No sprite sheet - just remove
                    deathAnimations.splice(i, 1);
                }
            }

            // Restore global camera
            camera = oldCamera;
        }

        // Game loop
        function gameLoop() {
            // Update
            player1.update();
            player2.update();

            // Collision detection
            platforms.forEach(platform => {
                player1.handlePlatformCollision(platform);
                player2.handlePlatformCollision(platform);
            });

            // Check if players fell off a platform (were grounded, now airborne without jumping)
            [player1, player2].forEach(player => {
                if ((player.wasOnGround || player.wasOnWall) && !player.onGround && !player.onWall) {
                    // Player fell off - only allow double jump, not first jump
                    player.jumpsLeft = Math.min(player.jumpsLeft, 1);
                }
            });

            spikes.forEach(spike => {
                player1.handleSpikeCollision(spike);
                player2.handleSpikeCollision(spike);
            });

            voidZones.forEach(voidZone => {
                player1.handleVoidZoneCollision(voidZone);
                player2.handleVoidZoneCollision(voidZone);
            });

            checkpoints.forEach(checkpoint => {
                player1.handleCheckpoint(checkpoint);
                player2.handleCheckpoint(checkpoint);
            });

            player1.handleGoal(goal);
            player2.handleGoal(goal);

            // Combat collision
            const p1Hit = player1.handleAttackCollision(player2);
            const p2Hit = player2.handleAttackCollision(player1);

            // Shade pogo collision - check if players can pogo off death animations
            deathAnimations.forEach(shade => {
                [player1, player2].forEach(player => {
                    if (player.attackTimer > 0 && player.attackDirection === 1) {
                        // Down attack - check for pogo collision with shade
                        const shadeSize = 40;
                        const shadeX = shade.x - shadeSize / 2;
                        const shadeY = shade.y - shadeSize / 2;

                        // Player's down attack hitbox (below player)
                        const hitboxWidth = 50;
                        const hitboxHeight = 35;
                        const hitboxX = player.x + player.width / 2 - hitboxWidth / 2;
                        const hitboxY = player.y + player.height;

                        // Check collision
                        if (hitboxX < shadeX + shadeSize &&
                            hitboxX + hitboxWidth > shadeX &&
                            hitboxY < shadeY + shadeSize &&
                            hitboxY + hitboxHeight > shadeY) {
                            // Pogo bounce!
                            player.vy = -POGO_BOUNCE;
                            player.jumpsLeft = 1;
                            player.dashAvailable = true;
                        }
                    }
                });
            });

            // Handle clash - both players attacking at same time
            if (p1Hit === 'clash' || p2Hit === 'clash') {
                // Push both players apart
                const midX = (player1.x + player2.x) / 2;
                const midY = (player1.y + player2.y) / 2;

                player1.vx = player1.x < player2.x ? -8 : 8;
                player2.vx = player2.x < player1.x ? -8 : 8;
                player1.vy = -4;
                player2.vy = -4;

                // Reset attack timers
                player1.attackTimer = 0;
                player2.attackTimer = 0;
                player1.attackCooldown = 20;
                player2.attackCooldown = 20;

                // Create clash spark particles at midpoint
                for (let i = 0; i < 25; i++) {
                    const angle = (i / 25) * Math.PI * 2;
                    const speed = Math.random() * 8 + 4;
                    player1.particles.push({
                        x: midX,
                        y: midY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 30,
                        color: '#ffff88'
                    });
                }
            }

            goal.update();

            updateCamera();
            updateUI();

            // Render - Split Screen (Path of Pain pale background)
            ctx.fillStyle = '#e8e4dc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const splitX = canvas.width / 2; // 600px

            // Render left viewport (Player 1)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, splitX, canvas.height);
            ctx.clip();
            renderWorld(camera1);
            ctx.restore();

            // Render right viewport (Player 2)
            ctx.save();
            ctx.translate(splitX, 0);
            ctx.beginPath();
            ctx.rect(0, 0, splitX, canvas.height);
            ctx.clip();
            renderWorld(camera2);
            ctx.restore();

            // Draw split divider line
            ctx.strokeStyle = '#3a3a3a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(splitX, 0);
            ctx.lineTo(splitX, canvas.height);
            ctx.stroke();

            // Draw viewport labels
            ctx.fillStyle = '#2a2a2a';
            ctx.font = '16px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('P1', splitX / 2, 30);
            ctx.fillText('P2', splitX + splitX / 2, 30);

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
