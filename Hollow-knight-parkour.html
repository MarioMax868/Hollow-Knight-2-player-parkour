<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Parkour Race - Path of Pain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
        }

        canvas {
            border: 3px solid #2a2a2a;
            background: #e8e4dc;
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        .player-indicator {
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
        }

        #winMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border: 3px solid #fff;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            font-size: 24px;
            display: none;
        }

        #winMessage button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #2a2a3f;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        #winMessage button:hover {
            background: #3a3a5f;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        <div id="ui">
            <div class="player-indicator" style="color: #e0e0e0;">
                P1 (WASD/Shift/Q) - Dash: <span id="p1dash">Ready</span>
            </div>
            <div class="player-indicator" style="color: #88ccff;">
                P2 (IJKL/U//) - Dash: <span id="p2dash">Ready</span>
            </div>
            <div style="margin-top: 10px; padding: 5px 10px; background: rgba(0, 0, 0, 0.5); border-radius: 3px;">
                Controls: Jump | Dash | Attack (Down/Up for directional)
            </div>
        </div>
        <div id="winMessage">
            <div id="winText"></div>
            <button onclick="restartGame()">Race Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.6;
        const PLAYER_SPEED = 4;
        const JUMP_POWER = 10;
        const WALL_JUMP_POWER_X = 7;
        const WALL_JUMP_POWER_Y = 11;
        const WALL_SLIDE_SPEED = 2.5;
        const DASH_SPEED = 10;
        const DASH_DURATION = 10;
        const DASH_COOLDOWN = 60; // frames
        const POGO_BOUNCE = 12;
        const PLAYER_SIZE = 20;

        // Game state
        let gameWon = false;
        let winner = null;

        // Sprite sheet loading - using known Hollow Knight sprite layout
        // Source: https://github.com/ak-2045/hollow-knight-animated-sprite-sheet
        const spriteSheet = {
            image: new Image(),
            loaded: false,
            spriteWidth: 128,
            spriteHeight: 128,
            // Animation definitions: { row, startCol, frames }
            // Covers: idle, walking, jumping, double jump, dashing, falling
            animations: {
                idle:       { row: 0,  startCol: 0,  frames: 1 },   // Standing still
                walk:       { row: 0,  startCol: 0,  frames: 8 },   // Walking/running
                jump:       { row: 9,  startCol: 0,  frames: 4 },   // First jump
                doubleJump: { row: 9,  startCol: 4,  frames: 4 },   // Double jump (second half of jump row)
                fall:       { row: 9,  startCol: 4,  frames: 4 },   // Falling (using later jump frames)
                dash:       { row: 4,  startCol: 1,  frames: 5 },   // Dashing (row 5, columns 2-6 counting from 1)
                wallSlide:  { row: 3,  startCol: 8,  frames: 4 },   // Wall sliding (row 4, cols 9-12 counting from 1)
                death:      { row: 10, startCol: 0,  frames: 12 }   // Death animation (row 11, entire row)
            },
            getFrame: function(animName, frameIndex) {
                const anim = this.animations[animName] || this.animations.idle;
                const col = anim.startCol + (frameIndex % anim.frames);
                return {
                    x: col * this.spriteWidth,
                    y: anim.row * this.spriteHeight,
                    width: this.spriteWidth,
                    height: this.spriteHeight
                };
            }
        };

        // Attack sprite sheet - separate sheet for attack animations
        const attackSpriteSheet = {
            image: new Image(),
            loaded: false,
            gridSize: 1024 / 12,     // 85.33 - spacing between sprites
            grabWidth: 60,           // Width to grab
            grabHeight: 50,          // Smaller height to avoid next row
            yOffset: 0,              // Start at top of cell
            xOffset: 10,             // Offset within cell
            // Attack animation: row 5, columns 1-6 (counting from 1)
            animation: { row: 4, startCol: 0, frames: 6 },
            getFrame: function(frameIndex) {
                const col = this.animation.startCol + (frameIndex % this.animation.frames);
                return {
                    x: col * this.gridSize + this.xOffset,
                    y: this.animation.row * this.gridSize + this.yOffset,
                    width: this.grabWidth,
                    height: this.grabHeight
                };
            }
        };

        function loadSpriteSheet() {
            spriteSheet.image.onload = () => {
                spriteSheet.loaded = true;
                console.log('Sprite sheet loaded! Size: ' + spriteSheet.image.width + 'x' + spriteSheet.image.height);
            };
            spriteSheet.image.onerror = () => {
                console.log('Sprite sheet not found - using drawn fallback');
                console.log('To use sprites: save sprite sheet as "knight_sprites.png" in same folder');
            };
            spriteSheet.image.src = 'knight_sprites.png';

            // Load attack sprite sheet
            attackSpriteSheet.image.onload = () => {
                attackSpriteSheet.loaded = true;
                console.log('Attack sprite sheet loaded! Size: ' + attackSpriteSheet.image.width + 'x' + attackSpriteSheet.image.height);
            };
            attackSpriteSheet.image.onerror = () => {
                console.log('Attack sprite sheet not found');
            };
            attackSpriteSheet.image.src = 'knight_attack.png';

            // Load bench sprite for checkpoints
            benchSprite.image.onload = () => {
                benchSprite.loaded = true;
                console.log('Bench sprite loaded! Size: ' + benchSprite.image.width + 'x' + benchSprite.image.height);
            };
            benchSprite.image.onerror = () => {
                console.log('Bench sprite not found - using drawn fallback');
            };
            benchSprite.image.src = 'Bench.png';
        }

        // Bench sprite for checkpoints
        const benchSprite = {
            image: new Image(),
            loaded: false
        };

        loadSpriteSheet();

        // Death animations array - stores active death animations at death locations
        const deathAnimations = [];

        // Cameras - one for each player (split screen)
        let camera1 = {
            x: 0,
            y: 0
        };

        let camera2 = {
            x: 0,
            y: 0
        };

        // Legacy camera reference for compatibility
        let camera = camera1;

        // Input state
        const keys = {};

        // Player class
        class Player {
            constructor(x, y, color, controls, label) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_SIZE;
                this.height = PLAYER_SIZE + 8; // Taller hitbox for knight shape
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.controls = controls;
                this.label = label;

                this.onGround = false;
                this.wasOnGround = false; // Track previous frame's ground state
                this.onWall = false;
                this.wasOnWall = false;
                this.wallDirection = 0; // -1 left, 1 right
                this.jumpsLeft = 2;
                this.attackDirection = 0; // 0 = horizontal, 1 = down, -1 = up

                this.dashTimer = 0;
                this.dashAvailable = true;
                this.dashDirection = { x: 0, y: 0 };

                this.checkpointX = x;
                this.checkpointY = y;

                this.particles = [];

                // Combat and animation properties
                this.facing = 1; // 1 = right, -1 = left
                this.attackTimer = 0;
                this.attackCooldown = 0;
                this.invincibilityFrames = 0;
                this.attackPressed = false;

                // Animation properties
                this.animTime = Math.random() * Math.PI * 2; // Offset for breathing
                this.runCycle = 0;
                this.landSquash = 0;
                this.cloakWave = 0;
                this.eyeBlink = 0;
                this.blinkTimer = 0;
                this.wasOnGround = false;
                this.knockbackFrames = 0; // Prevents movement during knockback
                this.wallJumpFrames = 0; // Prevents movement override during wall jump
                this.parryWindow = 0; // Extended window for parrying attacks
            }

            update() {
                if (gameWon) return;

                // Handle dash
                if (this.dashTimer > 0) {
                    this.vx = this.dashDirection.x * DASH_SPEED;
                    this.vy = this.dashDirection.y * DASH_SPEED * 0.5;
                    this.dashTimer--;

                    // Dash particles - shadow/void trail
                    if (Math.random() < 0.6) {
                        this.particles.push({
                            x: this.x + this.width / 2 + (Math.random() - 0.5) * 8,
                            y: this.y + this.height / 2 + (Math.random() - 0.5) * 12,
                            vx: -this.dashDirection.x * 2 + (Math.random() - 0.5) * 1,
                            vy: -this.dashDirection.y * 1 + (Math.random() - 0.5) * 1,
                            life: 22,
                            color: '#1a1a2e',
                            type: 'soul'
                        });
                    }
                    // Occasional white essence
                    if (Math.random() < 0.2) {
                        this.particles.push({
                            x: this.x + this.width / 2,
                            y: this.y + this.height / 2,
                            vx: (Math.random() - 0.5) * 3,
                            vy: (Math.random() - 0.5) * 3,
                            life: 18,
                            color: this.color,
                            type: 'essence'
                        });
                    }
                } else {
                    // Get movement input
                    let moveX = 0;
                    if (keys[this.controls.left]) moveX -= 1;
                    if (keys[this.controls.right]) moveX += 1;

                    // Knockback frames countdown
                    if (this.knockbackFrames > 0) {
                        this.knockbackFrames--;
                        // Apply friction during knockback but don't override velocity
                        this.vx *= 0.92;
                    } else if (this.wallJumpFrames > 0) {
                        // Wall jump momentum - gradually allow control back
                        this.wallJumpFrames--;
                        this.vx *= 0.95; // Slight friction
                        // Allow some influence but don't fully override
                        this.vx += moveX * PLAYER_SPEED * 0.15;
                    } else {
                        // Normal movement (only when not in knockback or wall jump)
                        this.vx = moveX * PLAYER_SPEED;
                    }

                    // Update facing direction (while wall sliding, always face toward the wall)
                    if (this.onWall) {
                        this.facing = -this.wallDirection;
                    } else if (moveX !== 0) {
                        this.facing = moveX > 0 ? 1 : -1;
                    }

                    // Apply gravity
                    if (this.onWall && this.vy > 0) {
                        // Wall slide
                        this.vy += GRAVITY * 0.3;
                        if (this.vy > WALL_SLIDE_SPEED) {
                            this.vy = WALL_SLIDE_SPEED;
                        }
                    } else {
                        this.vy += GRAVITY;
                    }

                    // Jump
                    if (keys[this.controls.jump] && !this.jumpPressed) {
                        this.jumpPressed = true;

                        if (this.onGround || this.onWall) {
                            if (this.onWall) {
                                // Wall jump - always pushes away from wall
                                this.vx = this.wallDirection * WALL_JUMP_POWER_X;
                                this.vy = -WALL_JUMP_POWER_Y;
                                this.jumpsLeft = 1; // Can still double jump after wall jump
                                this.wallJumpFrames = 12; // Prevent input override for a short time
                                this.createJumpParticles();
                            } else {
                                // Normal jump
                                this.vy = -JUMP_POWER;
                                this.jumpsLeft = 1;
                                this.createJumpParticles();
                            }
                        } else if (this.jumpsLeft > 0) {
                            // Double jump
                            this.vy = -JUMP_POWER;
                            this.jumpsLeft--;
                            this.createJumpParticles();
                        }
                    }

                    if (!keys[this.controls.jump]) {
                        this.jumpPressed = false;
                    }

                    // Dash
                    if (keys[this.controls.dash] && !this.dashPressed && this.dashAvailable) {
                        this.dashPressed = true;
                        this.dashTimer = DASH_DURATION;
                        this.dashAvailable = false;

                        // Determine dash direction
                        let dashX = 0;
                        let dashY = 0;

                        if (keys[this.controls.left]) dashX -= 1;
                        if (keys[this.controls.right]) dashX += 1;
                        if (keys[this.controls.down]) dashY += 1;
                        if (keys[this.controls.jump]) dashY -= 1;

                        // Default to facing direction if no input
                        if (dashX === 0 && dashY === 0) {
                            dashX = this.facing;
                        }

                        // Normalize
                        const mag = Math.sqrt(dashX * dashX + dashY * dashY);
                        if (mag > 0) {
                            this.dashDirection.x = dashX / mag;
                            this.dashDirection.y = dashY / mag;
                        }
                    }

                    if (!keys[this.controls.dash]) {
                        this.dashPressed = false;
                    }

                    // Attack
                    if (keys[this.controls.attack] && !this.attackPressed) {
                        this.attackPressed = true;
                        // Determine attack direction
                        if (!this.onGround && keys[this.controls.down]) {
                            this.attackDirection = 1; // Down attack
                        } else if (!this.onGround && keys[this.controls.jump]) {
                            this.attackDirection = -1; // Up attack
                        } else {
                            this.attackDirection = 0; // Horizontal attack
                        }
                        this.attack();
                    }

                    if (!keys[this.controls.attack]) {
                        this.attackPressed = false;
                    }

                    // Attack cooldown
                    if (this.attackCooldown > 0) {
                        this.attackCooldown--;
                    }

                    // Attack timer
                    if (this.attackTimer > 0) {
                        this.attackTimer--;
                    }

                    // Parry window timer
                    if (this.parryWindow > 0) {
                        this.parryWindow--;
                    }

                    // Invincibility frames
                    if (this.invincibilityFrames > 0) {
                        this.invincibilityFrames--;
                    }
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Animation updates
                this.animTime += 0.1;

                // Running animation
                if (this.onGround && Math.abs(this.vx) > 0.5) {
                    this.runCycle += Math.abs(this.vx) * 0.15;
                    // Running dust particles - Hollow Knight style
                    if (Math.random() < 0.18) {
                        this.particles.push({
                            x: this.x + this.width / 2 - this.vx * 0.3,
                            y: this.y + this.height,
                            vx: -this.vx * 0.15 + (Math.random() - 0.5) * 1.5,
                            vy: -Math.random() * 1.2 - 0.3,
                            life: 22,
                            color: '#888888',
                            type: 'dust'
                        });
                    }
                } else {
                    this.runCycle *= 0.8; // Smooth stop
                }

                // Cloak physics - flows based on movement
                const targetCloakWave = -this.vx * 0.15 + (this.vy > 0 ? -0.3 : 0.1);
                this.cloakWave += (targetCloakWave - this.cloakWave) * 0.2;

                // Landing squash animation
                if (this.onGround && !this.wasOnGround) {
                    this.landSquash = 0.3;
                }
                this.landSquash *= 0.85;
                this.wasOnGround = this.onGround;

                // Blinking
                this.blinkTimer++;
                if (this.blinkTimer > 180 + Math.random() * 120) {
                    this.eyeBlink = 1;
                    this.blinkTimer = 0;
                }
                if (this.eyeBlink > 0) {
                    this.eyeBlink -= 0.15;
                }

                // Save previous ground state before resetting
                this.wasOnGround = this.onGround;
                this.wasOnWall = this.onWall;

                // Reset ground/wall state
                this.onGround = false;
                this.onWall = false;

                // Update particles
                this.particles = this.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    return p.life > 0;
                });
            }

            createJumpParticles() {
                // Hollow Knight style soul/void burst effect
                // Main soul wisps floating upward
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI + Math.PI; // Spread downward
                    const speed = 1.5 + Math.random() * 1.5;
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 8,
                        y: this.y + this.height,
                        vx: Math.cos(angle) * speed * 0.4,
                        vy: Math.sin(angle) * speed * 0.5 + 0.5,
                        life: 30 + Math.random() * 15,
                        color: '#1a1a2e',
                        type: 'soul'
                    });
                }
                // White/pale soul essence
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 12,
                        y: this.y + this.height - 2,
                        vx: (Math.random() - 0.5) * 2,
                        vy: Math.random() * 1.5 + 0.5,
                        life: 25 + Math.random() * 10,
                        color: this.color,
                        type: 'essence'
                    });
                }
                // Ground dust puff
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 16,
                        y: this.y + this.height,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 2 - 0.5,
                        life: 20,
                        color: '#888888',
                        type: 'dust'
                    });
                }
            }

            attack() {
                if (this.attackCooldown <= 0 && this.attackTimer <= 0) {
                    this.attackTimer = 15;
                    this.attackCooldown = 25;
                    this.parryWindow = 25; // Extended parry window (longer than attack)

                    // Create slash particles based on direction - Hollow Knight style
                    for (let i = 0; i < 8; i++) {
                        let px, py, pvx, pvy;
                        if (this.attackDirection === 1) {
                            // Down attack
                            px = this.x + this.width / 2 + (Math.random() - 0.5) * 20;
                            py = this.y + this.height + 5;
                            pvx = (Math.random() - 0.5) * 4;
                            pvy = Math.random() * 5 + 3;
                        } else if (this.attackDirection === -1) {
                            // Up attack
                            px = this.x + this.width / 2 + (Math.random() - 0.5) * 20;
                            py = this.y - 5;
                            pvx = (Math.random() - 0.5) * 4;
                            pvy = -Math.random() * 5 - 3;
                        } else {
                            // Horizontal attack (flipped when wall sliding)
                            const particleFacing = this.onWall ? -this.facing : this.facing;
                            px = this.x + this.width / 2 + (15 * particleFacing);
                            py = this.y + this.height / 2 + (Math.random() - 0.5) * 20;
                            pvx = (Math.random() * 4 + 2) * particleFacing;
                            pvy = (Math.random() - 0.5) * 3;
                        }
                        this.particles.push({
                            x: px, y: py,
                            vx: pvx, vy: pvy,
                            life: 18,
                            color: '#ffffff',
                            type: 'slash'
                        });
                    }
                }
            }

            handleAttackCollision(otherPlayer) {
                if (this.attackTimer > 0 && otherPlayer.invincibilityFrames <= 0) {
                    // Check if attack hitbox overlaps with other player
                    // Hitbox varies based on attack direction
                    let hitboxX, hitboxY, hitboxWidth, hitboxHeight;

                    if (this.attackDirection === 1) {
                        // Down attack (pogo) - hitbox below player, only when moving down
                        if (this.vy <= 0) {
                            // Not moving down, no hitbox
                            return false;
                        }
                        hitboxWidth = 90;
                        hitboxHeight = 50;
                        hitboxX = this.x + this.width / 2 - hitboxWidth / 2;
                        hitboxY = this.y + this.height;
                    } else if (this.attackDirection === -1) {
                        // Up attack - hitbox above player
                        hitboxWidth = 80;
                        hitboxHeight = 30;
                        hitboxX = this.x + this.width / 2 - hitboxWidth / 2;
                        hitboxY = this.y - hitboxHeight;
                    } else {
                        // Horizontal attack - hitbox to the side
                        // When wall sliding, attack goes away from wall
                        const attackFacing = this.onWall ? -this.facing : this.facing;
                        const hitboxRange = 40;
                        hitboxX = this.x + (attackFacing > 0 ? this.width : -hitboxRange);
                        hitboxY = this.y;
                        hitboxWidth = hitboxRange;
                        hitboxHeight = this.height;
                    }

                    // Check collision
                    if (otherPlayer.x < hitboxX + hitboxWidth &&
                        otherPlayer.x + otherPlayer.width > hitboxX &&
                        otherPlayer.y < hitboxY + hitboxHeight &&
                        otherPlayer.y + otherPlayer.height > hitboxY) {

                        // Check if other player is in parry window - clash!
                        if (otherPlayer.parryWindow > 0) {
                            return 'clash';
                        }

                        // Knockback in the direction attacker is facing (flipped when wall sliding)
                        const knockbackDir = this.onWall ? -this.facing : this.facing;

                        // Apply knockback - less for up/down attacks
                        if (this.attackDirection === 0) {
                            // Horizontal attack - full knockback
                            otherPlayer.vx = knockbackDir * 12;
                            otherPlayer.vy = -2;
                            otherPlayer.knockbackFrames = 10;
                        } else if (this.attackDirection === -1) {
                            // Up attack
                            otherPlayer.vx = knockbackDir * 10;
                            otherPlayer.vy = -1.5;
                            otherPlayer.knockbackFrames = 9;
                        } else {
                            // Down attack - reduced knockback
                            otherPlayer.vx = knockbackDir * 8;
                            otherPlayer.vy = -1.5;
                            otherPlayer.knockbackFrames = 8;
                        }
                        otherPlayer.invincibilityFrames = 30;

                        // Pogo bounce if down attacking another player
                        if (this.attackDirection === 1) {
                            this.vy = -POGO_BOUNCE;
                            this.jumpsLeft = 1;
                            this.dashAvailable = true;
                        } else {
                            // Small recoil for attacker (non-pogo attacks)
                            this.vx = -knockbackDir * 3;
                        }

                        // Create impact particles
                        for (let i = 0; i < 12; i++) {
                            otherPlayer.particles.push({
                                x: otherPlayer.x + otherPlayer.width / 2,
                                y: otherPlayer.y + otherPlayer.height / 2,
                                vx: knockbackDir * (Math.random() * 6 + 3),
                                vy: (Math.random() - 0.5) * 4,
                                life: 25,
                                color: '#ffffff'
                            });
                        }

                        return true;
                    }
                }
                return false;
            }

            tryDrawSprite(offsetX, offsetY, isRunning, isJumping, isFalling, isDashing, isWallSliding, isAttacking) {
                // Check if sprite sheet is loaded
                if (!spriteSheet.loaded || !spriteSheet.image.complete) {
                    return false;
                }

                // Determine which animation and frame to use
                let animName = 'idle';
                let frameIndex = 0;

                // Knight base animation
                if (isDashing) {
                    animName = 'dash';
                    // Show all 5 frames during dash (DASH_DURATION is 12, so 12/5 ≈ 2.4 per frame)
                    frameIndex = Math.min(Math.floor((DASH_DURATION - this.dashTimer) / 2.5), 4);
                } else if (isWallSliding) {
                    animName = 'wallSlide';
                    frameIndex = Math.floor(this.animTime * 1.5);
                } else if (isJumping) {
                    // Check if double jump (jumpsLeft decreased means we used a jump)
                    if (this.jumpsLeft === 0) {
                        animName = 'doubleJump';
                    } else {
                        animName = 'jump';
                    }
                    frameIndex = Math.floor(this.animTime * 1.0);
                } else if (isFalling) {
                    animName = 'fall';
                    frameIndex = Math.floor(this.animTime * 1.0);
                } else if (isRunning) {
                    animName = 'walk';
                    frameIndex = Math.floor(this.runCycle * 0.25);
                } else {
                    animName = 'idle';
                    frameIndex = 0;
                }

                // Get frame coordinates using helper
                const frame = spriteSheet.getFrame(animName, frameIndex);

                // Draw the sprite
                const drawX = this.x - offsetX;
                const drawY = this.y - offsetY;

                // Scale sprite to game size
                const displayWidth = 55;
                const displayHeight = 55;

                ctx.save();

                // Position sprite - anchor at bottom center of character
                const centerX = drawX + this.width / 2;
                const bottomY = drawY + this.height;

                ctx.translate(centerX, bottomY);

                // Flip sprite based on facing direction
                ctx.scale(this.facing, 1);

                // Flash effect when invincible
                if (this.invincibilityFrames > 0 && Math.floor(this.invincibilityFrames / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.4;
                }

                // Draw sprite from sheet (anchored at bottom center)
                ctx.drawImage(
                    spriteSheet.image,
                    frame.x, frame.y,              // Source x, y on sheet
                    frame.width, frame.height,     // Source width, height
                    -displayWidth / 2,             // Dest x (centered)
                    -displayHeight,                // Dest y (above anchor point)
                    displayWidth, displayHeight    // Dest width, height
                );

                ctx.restore();

                // Draw slash effect when attacking - Hollow Knight style sweeping crescent
                if (isAttacking) {
                    ctx.save();
                    ctx.translate(centerX, bottomY - displayHeight / 2);
                    // When wall sliding, flip slash to face away from wall
                    const slashFacing = this.onWall ? -this.facing : this.facing;
                    ctx.scale(slashFacing, 1);

                    // Slash animation progress (0 to 1)
                    const slashProgress = (15 - this.attackTimer) / 15;

                    // Crescent grows slightly as it animates
                    const growFactor = 1 + slashProgress * 0.15;

                    let slashX, slashY, rotation;
                    let outerRadiusX, outerRadiusY, innerRadiusX, innerRadiusY, innerOffsetY;
                    let baseStartAngle, baseEndAngle;

                    if (this.attackDirection === 1) {
                        // Pogo/down attack - 2/3 of oval showing
                        outerRadiusX = 18 * growFactor;
                        outerRadiusY = 30 * growFactor;
                        innerRadiusX = 6 * growFactor;
                        innerRadiusY = 16 * growFactor;
                        innerOffsetY = 0;
                        slashX = 0;
                        slashY = 35;
                        rotation = 0;
                        baseStartAngle = -Math.PI * 0.33;
                        baseEndAngle = Math.PI * 1.33;
                    } else if (this.attackDirection === -1) {
                        // Up attack
                        outerRadiusX = 40 * growFactor;
                        outerRadiusY = 16 * growFactor;
                        innerRadiusX = 26 * growFactor;
                        innerRadiusY = 6 * growFactor;
                        innerOffsetY = -5 * growFactor;
                        slashX = 0;
                        slashY = -28;
                        rotation = -Math.PI / 2;
                        baseStartAngle = -Math.PI * 0.85;
                        baseEndAngle = Math.PI * 0.85;
                    } else {
                        // Side attack
                        outerRadiusX = 40 * growFactor;
                        outerRadiusY = 16 * growFactor;
                        innerRadiusX = 26 * growFactor;
                        innerRadiusY = 6 * growFactor;
                        innerOffsetY = -5 * growFactor;
                        slashX = 20;
                        slashY = 8;
                        rotation = 0;
                        baseStartAngle = -Math.PI * 0.55;
                        baseEndAngle = Math.PI * 0.85;
                    }

                    ctx.save();
                    ctx.translate(slashX, slashY);
                    ctx.rotate(rotation);

                    // Draw slash in segments - thin part (top) appears/fades first, thick part (bottom) follows
                    const numSegments = 20;
                    const totalArc = baseEndAngle - baseStartAngle;
                    const segmentArc = totalArc / numSegments;

                    // Taper settings for down attack
                    const isTaperedSlash = (this.attackDirection === 1);
                    const minInnerX = innerRadiusX * 0.3;
                    const maxInnerX = innerRadiusX * 1.2;
                    const minInnerY = innerRadiusY * 0.3;
                    const maxInnerY = innerRadiusY * 1.2;

                    for (let i = 0; i < numSegments; i++) {
                        // Segment timing - top segments (low i) lead, bottom segments (high i) trail
                        const segmentDelay = i * 0.03; // Each segment delayed slightly
                        const segmentProgress = Math.max(0, Math.min(1, (slashProgress - segmentDelay) * 1.8));

                        // Appear fast, fade slower
                        const appearProgress = Math.min(1, segmentProgress * 3);
                        const fadeProgress = Math.max(0, (segmentProgress - 0.3) * 1.4);
                        const segmentAlpha = appearProgress * (1 - fadeProgress);

                        if (segmentAlpha <= 0) continue;

                        const segStart = baseStartAngle + i * segmentArc;
                        const segEnd = baseStartAngle + (i + 1) * segmentArc;

                        // Calculate tapered inner radius based on segment position and facing
                        let segInnerX = innerRadiusX;
                        let segInnerY = innerRadiusY;
                        if (isTaperedSlash) {
                            const taperT = i / (numSegments - 1);
                            // Facing right: thin on left (low i), thick on right (high i)
                            // Facing left: thick on left (low i), thin on right (high i)
                            const taperFactor = this.facing > 0 ? taperT : (1 - taperT);
                            segInnerX = minInnerX + (maxInnerX - minInnerX) * taperFactor;
                            segInnerY = minInnerY + (maxInnerY - minInnerY) * taperFactor;
                        }

                        ctx.fillStyle = `rgba(255, 255, 255, ${segmentAlpha})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, segStart, segEnd);
                        ctx.ellipse(0, innerOffsetY, segInnerX, segInnerY, 0, segEnd, segStart, true);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // Bright edge on the outer rim (follows thick part timing)
                    const edgeAlpha = Math.max(0, 1 - (slashProgress - 0.3) * 1.5);
                    if (edgeAlpha > 0) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${edgeAlpha * 0.8})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, baseStartAngle, baseEndAngle);
                        ctx.stroke();
                    }

                    ctx.restore();
                    ctx.restore();
                }

                // Draw label above sprite
                ctx.fillStyle = '#1a1a1a';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(this.label, drawX + this.width / 2, drawY - 25);

                return true; // Sprite was drawn
            }

            drawKnight(offsetX = 0, offsetY = 0) {
                const baseX = this.x - offsetX + this.width / 2;
                const baseY = this.y - offsetY + this.height - 4;

                // Animation calculations
                const breathe = Math.sin(this.animTime * 0.8) * 0.5;
                const isRunning = this.onGround && Math.abs(this.vx) > 0.5;
                const isJumping = !this.onGround && this.vy < 0;
                const isFalling = !this.onGround && this.vy > 0;
                const isWallSliding = this.onWall;
                const isDashing = this.dashTimer > 0;
                const isLookingUp = keys[this.controls.jump] && this.onGround;
                const isLookingDown = keys[this.controls.down] && !this.onGround;
                const isAttacking = this.attackTimer > 0;

                // Try to use sprites if loaded
                if (this.tryDrawSprite(offsetX, offsetY, isRunning, isJumping, isFalling, isDashing, isWallSliding, isAttacking)) {
                    return; // Sprite was drawn successfully
                }

                // Fallback to code-drawn Knight if sprites not available

                // Squash and stretch
                let scaleX = 1 - this.landSquash * 0.2;
                let scaleY = 1 + this.landSquash * 0.3;

                if (isJumping) {
                    scaleX = 0.95;
                    scaleY = 1.08;
                } else if (isFalling) {
                    scaleX = 1.03;
                    scaleY = 0.97;
                } else if (isDashing) {
                    scaleX = 1.15;
                    scaleY = 0.85;
                }

                // Flash white when invincible
                const isFlashing = this.invincibilityFrames > 0 && Math.floor(this.invincibilityFrames / 4) % 2 === 0;

                // Body tilt based on movement
                let bodyTilt = 0;
                let headTilt = 0;
                if (isRunning) {
                    bodyTilt = this.facing * 0.08;
                } else if (isWallSliding) {
                    bodyTilt = -this.wallDirection * 0.2;
                }
                if (isLookingUp) {
                    headTilt = -0.15;
                } else if (isLookingDown) {
                    headTilt = 0.25;
                }

                ctx.save();
                ctx.translate(baseX, baseY);
                ctx.scale(this.facing, 1);

                // Colors
                const cloakColor = isFlashing ? '#ffffff' : '#3d3d50';
                const cloakDark = isFlashing ? '#ffffff' : '#2a2a3a';
                const maskColor = isFlashing ? '#ffffff' : this.color;

                // Cloak wave physics
                const wave1 = Math.sin(this.animTime * 2 + this.cloakWave * 2) * 2;
                const wave2 = Math.sin(this.animTime * 2.5 + 1 + this.cloakWave * 1.5) * 2.5;

                ctx.save();
                ctx.rotate(bodyTilt);
                ctx.scale(scaleX, scaleY);

                // === CLOAK / BODY ===
                // The Knight's cloak is simple - a dark rounded shape
                ctx.fillStyle = cloakColor;
                ctx.beginPath();
                ctx.moveTo(-7, -12); // Left shoulder
                ctx.lineTo(7, -12);  // Right shoulder

                // Right side flows down
                ctx.quadraticCurveTo(10, -4, 9 + wave1 * 0.5, 4);
                ctx.quadraticCurveTo(8 + wave2 * 0.5, 10, 5, 12);

                // Bottom hem with subtle wave
                ctx.quadraticCurveTo(2, 13 + wave1 * 0.3, 0, 12);
                ctx.quadraticCurveTo(-2, 13 + wave1 * 0.3, -5, 12);

                // Left side
                ctx.quadraticCurveTo(-8 - wave2 * 0.5, 10, -9 - wave1 * 0.5, 4);
                ctx.quadraticCurveTo(-10, -4, -7, -12);
                ctx.closePath();
                ctx.fill();

                // Simple center fold line
                ctx.strokeStyle = cloakDark;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, -8);
                ctx.lineTo(0, 10);
                ctx.stroke();

                // Running legs
                if (isRunning) {
                    const legPhase = Math.sin(this.runCycle);
                    ctx.fillStyle = cloakDark;

                    ctx.save();
                    ctx.translate(2, 10);
                    ctx.rotate(legPhase * 0.4);
                    ctx.beginPath();
                    ctx.ellipse(0, 3, 2.5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.translate(-2, 10);
                    ctx.rotate(-legPhase * 0.4);
                    ctx.beginPath();
                    ctx.ellipse(0, 3, 2.5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore(); // Restore from body transform

                // === HEAD / MASK ===
                ctx.save();
                ctx.rotate(bodyTilt + headTilt);

                // The Knight's head is a smooth oval/egg shape, pointed at bottom
                // It sits on top of the cloak

                ctx.fillStyle = maskColor;
                ctx.beginPath();
                // Start at chin (pointed bottom)
                ctx.moveTo(0, -6 + breathe);
                // Right side curves out then up
                ctx.bezierCurveTo(7, -8 + breathe, 10, -16 + breathe, 9, -22 + breathe);
                // Top of head curves across
                ctx.bezierCurveTo(7, -28 + breathe, -7, -28 + breathe, -9, -22 + breathe);
                // Left side curves down to chin
                ctx.bezierCurveTo(-10, -16 + breathe, -7, -8 + breathe, 0, -6 + breathe);
                ctx.fill();

                // === HORNS ===
                // Two curved horns that sweep up and slightly outward
                // They emerge from the top sides of the head

                ctx.fillStyle = maskColor;

                // Left horn
                ctx.beginPath();
                ctx.moveTo(-6, -24 + breathe); // Base of horn on head
                ctx.bezierCurveTo(-7, -28 + breathe, -10, -34 + breathe, -7, -40 + breathe); // Outer edge curves to tip
                ctx.bezierCurveTo(-5, -36 + breathe, -4, -30 + breathe, -4, -24 + breathe); // Inner edge back to head
                ctx.closePath();
                ctx.fill();

                // Right horn
                ctx.beginPath();
                ctx.moveTo(6, -24 + breathe);
                ctx.bezierCurveTo(7, -28 + breathe, 10, -34 + breathe, 7, -40 + breathe);
                ctx.bezierCurveTo(5, -36 + breathe, 4, -30 + breathe, 4, -24 + breathe);
                ctx.closePath();
                ctx.fill();

                // === EYES ===
                // The Knight has two large, completely black, void-like eyes
                // They're tall ovals, slightly angled inward at the top

                if (!isFlashing) {
                    const eyeScale = Math.max(0.1, 1 - this.eyeBlink);
                    const lookX = this.vx * 0.05;
                    const lookY = this.vy * 0.03 + (isLookingUp ? -1.5 : 0) + (isLookingDown ? 1.5 : 0);

                    ctx.fillStyle = '#000000';

                    // Left eye - tall oval, angled slightly
                    ctx.save();
                    ctx.translate(-4 + lookX, -17 + breathe + lookY);
                    ctx.rotate(-0.1); // Slight inward angle
                    ctx.scale(1, eyeScale);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 2.5, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Right eye
                    ctx.save();
                    ctx.translate(4 + lookX, -17 + breathe + lookY);
                    ctx.rotate(0.1); // Slight inward angle
                    ctx.scale(1, eyeScale);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 2.5, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore(); // Restore from head transform
                ctx.restore(); // Restore from main transform

                // --- NAIL WEAPON --- (drawn in world space, not transformed)
                const nailBaseX = baseX + 6 * this.facing;
                const nailBaseY = baseY - 8;

                // Attack animation - Hollow Knight style sweeping crescent slash
                if (this.attackTimer > 0) {
                    const slashProgress = 1 - (this.attackTimer / 15);
                    const growFactor = 1 + slashProgress * 0.15;

                    let outerRadiusX, outerRadiusY, innerRadiusX, innerRadiusY, innerOffsetY;
                    let baseStartAngle, baseEndAngle;

                    ctx.save();

                    if (this.attackDirection === 1) {
                        // Pogo/down attack - 2/3 of oval showing
                        outerRadiusX = 18 * growFactor;
                        outerRadiusY = 30 * growFactor;
                        innerRadiusX = 6 * growFactor;
                        innerRadiusY = 16 * growFactor;
                        innerOffsetY = 0;
                        ctx.translate(baseX, baseY + 31);
                        this.drawNail(baseX, baseY, Math.PI / 2, isFlashing);
                        baseStartAngle = -Math.PI * 0.33;
                        baseEndAngle = Math.PI * 1.33;
                    } else if (this.attackDirection === -1) {
                        outerRadiusX = 40 * growFactor;
                        outerRadiusY = 16 * growFactor;
                        innerRadiusX = 26 * growFactor;
                        innerRadiusY = 6 * growFactor;
                        innerOffsetY = -5 * growFactor;
                        ctx.translate(baseX, baseY - 32);
                        ctx.rotate(-Math.PI / 2);
                        this.drawNail(baseX, baseY - 20, -Math.PI / 2, isFlashing);
                        baseStartAngle = -Math.PI * 0.85;
                        baseEndAngle = Math.PI * 0.85;
                    } else {
                        outerRadiusX = 40 * growFactor;
                        outerRadiusY = 16 * growFactor;
                        innerRadiusX = 26 * growFactor;
                        innerRadiusY = 6 * growFactor;
                        innerOffsetY = -5 * growFactor;
                        ctx.translate(baseX + 20 * this.facing, baseY + 3);
                        if (this.facing < 0) ctx.scale(-1, 1);
                        const swingAngle = (slashProgress * Math.PI * 0.8 - Math.PI * 0.4) * this.facing;
                        this.drawNail(nailBaseX, nailBaseY, swingAngle, isFlashing);
                        baseStartAngle = -Math.PI * 0.55;
                        baseEndAngle = Math.PI * 0.85;
                    }

                    // Draw slash in segments - thin part (top) appears/fades first, thick part (bottom) follows
                    const numSegments = 20;
                    const totalArc = baseEndAngle - baseStartAngle;
                    const segmentArc = totalArc / numSegments;

                    // Taper settings for down attack
                    const isTaperedSlash = (this.attackDirection === 1);
                    const minInnerX = innerRadiusX * 0.3;
                    const maxInnerX = innerRadiusX * 1.2;
                    const minInnerY = innerRadiusY * 0.3;
                    const maxInnerY = innerRadiusY * 1.2;

                    for (let i = 0; i < numSegments; i++) {
                        const segmentDelay = i * 0.03;
                        const segmentProgress = Math.max(0, Math.min(1, (slashProgress - segmentDelay) * 1.8));
                        const appearProgress = Math.min(1, segmentProgress * 3);
                        const fadeProgress = Math.max(0, (segmentProgress - 0.3) * 1.4);
                        const segmentAlpha = appearProgress * (1 - fadeProgress);

                        if (segmentAlpha <= 0) continue;

                        const segStart = baseStartAngle + i * segmentArc;
                        const segEnd = baseStartAngle + (i + 1) * segmentArc;

                        // Calculate tapered inner radius based on segment position and facing
                        let segInnerX = innerRadiusX;
                        let segInnerY = innerRadiusY;
                        if (isTaperedSlash) {
                            const taperT = i / (numSegments - 1);
                            const taperFactor = this.facing > 0 ? taperT : (1 - taperT);
                            segInnerX = minInnerX + (maxInnerX - minInnerX) * taperFactor;
                            segInnerY = minInnerY + (maxInnerY - minInnerY) * taperFactor;
                        }

                        ctx.fillStyle = `rgba(255, 255, 255, ${segmentAlpha})`;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, segStart, segEnd);
                        ctx.ellipse(0, innerOffsetY, segInnerX, segInnerY, 0, segEnd, segStart, true);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // Bright edge
                    const edgeAlpha = Math.max(0, 1 - (slashProgress - 0.3) * 1.5);
                    if (edgeAlpha > 0) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${edgeAlpha * 0.8})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, baseStartAngle, baseEndAngle);
                        ctx.stroke();
                    }

                    ctx.restore();
                } else {
                    // Idle nail position with subtle bob
                    const idleAngle = (this.facing > 0 ? 0.3 : Math.PI - 0.3) + Math.sin(this.animTime * 0.5) * 0.05;
                    this.drawNail(nailBaseX, nailBaseY, idleAngle, isFlashing);
                }

                // Dash afterimage effect
                if (isDashing) {
                    ctx.globalAlpha = 0.3;
                    for (let i = 1; i <= 3; i++) {
                        const ghostX = baseX - this.dashDirection.x * DASH_SPEED * i * 0.5;
                        const ghostY = baseY - this.dashDirection.y * DASH_SPEED * i * 0.3;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.ellipse(ghostX, ghostY - 15, 8 - i, 10 - i, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                // Wall slide particles - stone dust
                if (isWallSliding && this.vy > 0) {
                    if (Math.random() < 0.35) {
                        this.particles.push({
                            x: this.x + (this.wallDirection < 0 ? this.width + 2 : -2),
                            y: this.y + Math.random() * this.height,
                            vx: -this.wallDirection * (Math.random() * 1.5 + 0.5),
                            vy: -Math.random() * 1.5 + 0.5,
                            life: 18,
                            color: '#999999',
                            type: 'dust'
                        });
