<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Parkour Race - Path of Pain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        canvas {
            border: 3px solid #2a2a2a;
            background: #e8e4dc;
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        #canvasWrapper {
            position: relative;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        .player-indicator {
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
        }

        #winMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border: 3px solid #fff;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            font-size: 24px;
            display: none;
        }

        #winMessage button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 18px;
            background: #2a2a3f;
            color: #fff;
            border: 2px solid #fff;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        #winMessage button:hover {
            background: #3a3a5f;
        }

    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvasWrapper">
            <canvas id="gameCanvas" width="1200" height="800"></canvas>
            <div id="ui">
                <div class="player-indicator" style="color: #e0e0e0;">
                    P1: <span id="p1controls">WASD/Shift/Q</span> - Dash: <span id="p1dash">Ready</span>
                </div>
                <div class="player-indicator" style="color: #88ccff;">
                    P2: <span id="p2controls">IJKL/B/U</span> - Dash: <span id="p2dash">Ready</span>
                </div>
                <div style="margin-top: 10px; padding: 5px 10px; background: rgba(0, 0, 0, 0.5); border-radius: 3px;">
                    Controls: Jump | Dash | Attack (Down/Up for directional)
                </div>
            </div>
            <div id="winMessage">
                <div id="winText"></div>
                <button onclick="restartGame()">Race Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game constants
        const GRAVITY = 0.6;
        const PLAYER_SPEED = 4;
        const JUMP_POWER = 10;
        const WALL_JUMP_POWER_X = 7;
        const WALL_JUMP_POWER_Y = 11;
        const WALL_SLIDE_SPEED = 4;
        const DASH_SPEED = 10;
        const DASH_DURATION = 10;
        const DASH_COOLDOWN = 60; // frames
        const POGO_BOUNCE = 12;
        const PLAYER_SIZE = 20;

        // Charm definitions
        const CHARMS = {
            sprintmaster: { name: 'Sprintmaster', notches: 1, description: 'Increases walking speed' },
            wallCling: { name: 'Wall Cling', notches: 1, description: 'Stop sliding on walls' },
            longNail: { name: 'Long Nail', notches: 1, description: 'Slightly increases nail range' },
            quickSlash: { name: 'Quick Slash', notches: 2, description: 'Decreases attack cooldown' },
            markOfPride: { name: 'Mark of Pride', notches: 2, description: 'Greatly increases nail range' },
            tripleJump: { name: 'Triple Jump', notches: 3, description: 'Jump 3 times instead of 2' }
        };
        const MAX_NOTCHES = 3;

        // Player charm loadouts
        let p1Charms = [];
        let p2Charms = [];
        let charmSelectActive = true; // Start with charm selection

        // Game state
        let gameWon = false;
        let winner = null;

        // Sprite sheet loading - using known Hollow Knight sprite layout
        // Source: https://github.com/ak-2045/hollow-knight-animated-sprite-sheet
        const spriteSheet = {
            image: new Image(),
            loaded: false,
            spriteWidth: 128,
            spriteHeight: 128,
            // Animation definitions: { row, startCol, frames }
            // Covers: idle, walking, jumping, double jump, dashing, falling
            animations: {
                idle:       { row: 0,  startCol: 0,  frames: 1 },   // Standing still
                walk:       { row: 0,  startCol: 0,  frames: 8 },   // Walking/running
                jump:       { row: 9,  startCol: 0,  frames: 4 },   // First jump
                doubleJump: { row: 9,  startCol: 4,  frames: 4 },   // Double jump (second half of jump row)
                fall:       { row: 9,  startCol: 4,  frames: 4 },   // Falling (using later jump frames)
                dash:       { row: 4,  startCol: 1,  frames: 5 },   // Dashing (row 5, columns 2-6 counting from 1)
                wallSlide:  { row: 3,  startCol: 8,  frames: 4 },   // Wall sliding (row 4, cols 9-12 counting from 1)
                death:      { row: 10, startCol: 0,  frames: 12 }   // Death animation (row 11, entire row)
            },
            getFrame: function(animName, frameIndex) {
                const anim = this.animations[animName] || this.animations.idle;
                const col = anim.startCol + (frameIndex % anim.frames);
                return {
                    x: col * this.spriteWidth,
                    y: anim.row * this.spriteHeight,
                    width: this.spriteWidth,
                    height: this.spriteHeight
                };
            }
        };

        // Attack sprite sheet - separate sheet for attack animations
        const attackSpriteSheet = {
            image: new Image(),
            loaded: false,
            gridSize: 1024 / 12,     // 85.33 - spacing between sprites
            grabWidth: 60,           // Width to grab
            grabHeight: 50,          // Smaller height to avoid next row
            yOffset: 0,              // Start at top of cell
            xOffset: 10,             // Offset within cell
            // Attack animation: row 5, columns 1-6 (counting from 1)
            animation: { row: 4, startCol: 0, frames: 6 },
            getFrame: function(frameIndex) {
                const col = this.animation.startCol + (frameIndex % this.animation.frames);
                return {
                    x: col * this.gridSize + this.xOffset,
                    y: this.animation.row * this.gridSize + this.yOffset,
                    width: this.grabWidth,
                    height: this.grabHeight
                };
            }
        };

        function loadSpriteSheet() {
            spriteSheet.image.onload = () => {
                spriteSheet.loaded = true;
                console.log('Sprite sheet loaded! Size: ' + spriteSheet.image.width + 'x' + spriteSheet.image.height);
            };
            spriteSheet.image.onerror = () => {
                console.log('Sprite sheet not found - using drawn fallback');
                console.log('To use sprites: save sprite sheet as "knight_sprites.png" in same folder');
            };
            spriteSheet.image.src = 'knight_sprites.png';

            // Load attack sprite sheet
            attackSpriteSheet.image.onload = () => {
                attackSpriteSheet.loaded = true;
                console.log('Attack sprite sheet loaded! Size: ' + attackSpriteSheet.image.width + 'x' + attackSpriteSheet.image.height);
            };
            attackSpriteSheet.image.onerror = () => {
                console.log('Attack sprite sheet not found');
            };
            attackSpriteSheet.image.src = 'knight_attack.png';

            // Load bench sprite for checkpoints
            benchSprite.image.onload = () => {
                benchSprite.loaded = true;
                console.log('Bench sprite loaded! Size: ' + benchSprite.image.width + 'x' + benchSprite.image.height);
            };
            benchSprite.image.onerror = () => {
                console.log('Bench sprite not found - using drawn fallback');
            };
            benchSprite.image.src = 'Bench.png';
        }

        // Bench sprite for checkpoints
        const benchSprite = {
            image: new Image(),
            loaded: false
        };

        loadSpriteSheet();

        // Death animations array - stores active death animations at death locations
        const deathAnimations = [];

        // Cameras - one for each player (split screen)
        let camera1 = {
            x: 0,
            y: 0
        };

        let camera2 = {
            x: 0,
            y: 0
        };

        // Legacy camera reference for compatibility
        let camera = camera1;

        // Input state
        const keys = {};

        // Player class
        class Player {
            constructor(x, y, color, controls, label) {
                this.x = x;
                this.y = y;
                this.width = PLAYER_SIZE;
                this.height = PLAYER_SIZE + 8; // Taller hitbox for knight shape
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.controls = controls;
                this.label = label;

                this.onGround = false;
                this.wasOnGround = false; // Track previous frame's ground state
                this.onWall = false;
                this.wasOnWall = false;
                this.wallDirection = 0; // -1 left, 1 right
                this.jumpsLeft = 2;
                this.attackDirection = 0; // 0 = horizontal, 1 = down, -1 = up

                this.dashTimer = 0;
                this.dashAvailable = true;
                this.dashDirection = { x: 0, y: 0 };

                this.checkpointX = x;
                this.checkpointY = y;

                this.particles = [];

                // Combat and animation properties
                this.facing = 1; // 1 = right, -1 = left
                this.attackTimer = 0;
                this.attackCooldown = 0;
                this.invincibilityFrames = 0;
                this.attackPressed = false;
                this.pogoBounced = false; // Track if pogo bounce already happened this attack

                // Animation properties
                this.animTime = Math.random() * Math.PI * 2; // Offset for breathing
                this.runCycle = 0;
                this.landSquash = 0;
                this.cloakWave = 0;
                this.eyeBlink = 0;
                this.blinkTimer = 0;
                this.wingTimer = 0; // Monarch Wings effect on double jump
                this.wingFadeSpeed = 1; // Normal fade speed, increases for quick fade
                this.wasOnGround = false;
                this.coyoteTime = 0; // Grace period for jumping after leaving platform
                this.knockbackFrames = 0; // Prevents movement during knockback
                this.wallJumpFrames = 0; // Prevents movement override during wall jump
                this.parryWindow = 0; // Extended window for parrying attacks
            }

            update() {
                if (gameWon) return;

                // Handle dash
                if (this.dashTimer > 0) {
                    this.vx = this.dashDirection.x * DASH_SPEED;
                    this.vy = this.dashDirection.y * DASH_SPEED * 0.5;
                    this.dashTimer--;

                    // Dash particles - shadow/void trail
                    if (Math.random() < 0.6) {
                        this.particles.push({
                            x: this.x + this.width / 2 + (Math.random() - 0.5) * 8,
                            y: this.y + this.height / 2 + (Math.random() - 0.5) * 12,
                            vx: -this.dashDirection.x * 2 + (Math.random() - 0.5) * 1,
                            vy: -this.dashDirection.y * 1 + (Math.random() - 0.5) * 1,
                            life: 22,
                            color: '#1a1a2e',
                            type: 'soul'
                        });
                    }
                    // Occasional white essence
                    if (Math.random() < 0.2) {
                        this.particles.push({
                            x: this.x + this.width / 2,
                            y: this.y + this.height / 2,
                            vx: (Math.random() - 0.5) * 3,
                            vy: (Math.random() - 0.5) * 3,
                            life: 18,
                            color: this.color,
                            type: 'essence'
                        });
                    }
                } else {
                    // Get movement input
                    let moveX = 0;
                    if (keys[this.controls.left]) moveX -= 1;
                    if (keys[this.controls.right]) moveX += 1;

                    // Knockback frames countdown
                    // Calculate speed with Sprintmaster bonus
                    const speedMultiplier = hasCharm(this, 'sprintmaster') ? 1.2 : 1.0;
                    const effectiveSpeed = PLAYER_SPEED * speedMultiplier;

                    if (this.knockbackFrames > 0) {
                        this.knockbackFrames--;
                        // Apply friction during knockback but don't override velocity
                        this.vx *= 0.92;
                    } else if (this.wallJumpFrames > 0) {
                        // Wall jump momentum - gradually allow control back
                        this.wallJumpFrames--;
                        this.vx *= 0.95; // Slight friction
                        // Allow some influence but don't fully override
                        this.vx += moveX * effectiveSpeed * 0.15;
                    } else {
                        // Normal movement (only when not in knockback or wall jump)
                        this.vx = moveX * effectiveSpeed;
                    }

                    // Update facing direction (while wall sliding, always face toward the wall)
                    if (this.onWall) {
                        this.facing = -this.wallDirection;
                    } else if (moveX !== 0) {
                        this.facing = moveX > 0 ? 1 : -1;
                    }

                    // Apply gravity
                    if (this.onWall && hasCharm(this, 'wallCling')) {
                        // Wall Cling - completely stop on wall
                        if (this.vy > 0) this.vy = 0;
                        // Don't apply gravity while clinging
                    } else if (this.onWall && this.vy > 0) {
                        // Normal wall slide
                        this.vy += GRAVITY * 0.3;
                        if (this.vy > WALL_SLIDE_SPEED) {
                            this.vy = WALL_SLIDE_SPEED;
                        }
                    } else {
                        this.vy += GRAVITY;
                    }

                    // Jump
                    if (keys[this.controls.jump] && !this.jumpPressed) {
                        this.jumpPressed = true;

                        if (this.onGround || this.onWall || this.coyoteTime > 0) {
                            if (this.onWall) {
                                // Wall jump - always pushes away from wall
                                this.vx = this.wallDirection * WALL_JUMP_POWER_X;
                                this.vy = -WALL_JUMP_POWER_Y;
                                this.jumpsLeft = getMaxJumps(this) - 1; // Can still double/triple jump after wall jump
                                this.wallJumpFrames = 12; // Prevent input override for a short time
                                this.createJumpParticles();
                            } else {
                                // Normal jump (or coyote time jump)
                                this.vy = -JUMP_POWER;
                                this.jumpsLeft = getMaxJumps(this) - 1;
                                this.coyoteTime = 0; // Use up coyote time
                                this.createJumpParticles();
                            }
                        } else if (this.jumpsLeft > 0) {
                            // Double jump
                            this.vy = -JUMP_POWER;
                            this.jumpsLeft--;
                            this.wingTimer = 25; // Show Monarch Wings
                            this.wingFadeSpeed = 1; // Reset to normal fade speed
                            this.createJumpParticles();
                        }
                    }

                    if (!keys[this.controls.jump]) {
                        this.jumpPressed = false;
                    }

                    // Dash
                    if (keys[this.controls.dash] && !this.dashPressed && this.dashAvailable) {
                        this.dashPressed = true;
                        this.dashTimer = DASH_DURATION;
                        this.wingFadeSpeed = 5; // Quick fade wings when dashing
                        this.dashAvailable = false;

                        // Determine dash direction
                        let dashX = 0;
                        let dashY = 0;

                        if (keys[this.controls.left]) dashX -= 1;
                        if (keys[this.controls.right]) dashX += 1;
                        if (keys[this.controls.down]) dashY += 1;
                        if (keys[this.controls.jump]) dashY -= 1;

                        // Default to facing direction if no input
                        if (dashX === 0 && dashY === 0) {
                            dashX = this.facing;
                        }

                        // Normalize
                        const mag = Math.sqrt(dashX * dashX + dashY * dashY);
                        if (mag > 0) {
                            this.dashDirection.x = dashX / mag;
                            this.dashDirection.y = dashY / mag;
                        }
                    }

                    if (!keys[this.controls.dash]) {
                        this.dashPressed = false;
                    }

                    // Attack (check main attack key and alternate if set)
                    const attackKeyPressed = keys[this.controls.attack] ||
                        (this.controls.attackAlt && keys[this.controls.attackAlt]);
                    if (attackKeyPressed && !this.attackPressed) {
                        this.attackPressed = true;
                        // Determine attack direction
                        if (!this.onGround && keys[this.controls.down]) {
                            this.attackDirection = 1; // Down attack
                        } else if (!this.onGround && keys[this.controls.jump]) {
                            this.attackDirection = -1; // Up attack
                        } else {
                            this.attackDirection = 0; // Horizontal attack
                        }
                        this.attack();
                    }

                    if (!attackKeyPressed) {
                        this.attackPressed = false;
                    }

                    // Attack cooldown
                    if (this.attackCooldown > 0) {
                        this.attackCooldown--;
                    }

                    // Attack timer
                    if (this.attackTimer > 0) {
                        this.attackTimer--;
                    }

                    // Parry window timer
                    if (this.parryWindow > 0) {
                        this.parryWindow--;
                    }

                    // Invincibility frames
                    if (this.invincibilityFrames > 0) {
                        this.invincibilityFrames--;
                    }

                    // Wing timer for Monarch Wings effect
                    if (this.wingTimer > 0) {
                        this.wingTimer -= this.wingFadeSpeed;
                        if (this.wingTimer <= 0) {
                            this.wingTimer = 0;
                            this.wingFadeSpeed = 1; // Reset fade speed
                        }
                    }
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Animation updates
                this.animTime += 0.1;

                // Running animation
                if (this.onGround && Math.abs(this.vx) > 0.5) {
                    this.runCycle += Math.abs(this.vx) * 0.15;
                    // Running dust particles - Hollow Knight style
                    if (Math.random() < 0.18) {
                        this.particles.push({
                            x: this.x + this.width / 2 - this.vx * 0.3,
                            y: this.y + this.height,
                            vx: -this.vx * 0.15 + (Math.random() - 0.5) * 1.5,
                            vy: -Math.random() * 1.2 - 0.3,
                            life: 22,
                            color: '#888888',
                            type: 'dust'
                        });
                    }
                } else {
                    this.runCycle *= 0.8; // Smooth stop
                }

                // Cloak physics - flows based on movement
                const targetCloakWave = -this.vx * 0.15 + (this.vy > 0 ? -0.3 : 0.1);
                this.cloakWave += (targetCloakWave - this.cloakWave) * 0.2;

                // Landing squash animation
                if (this.onGround && !this.wasOnGround) {
                    this.landSquash = 0.3;
                }
                this.landSquash *= 0.85;
                this.wasOnGround = this.onGround;

                // Blinking
                this.blinkTimer++;
                if (this.blinkTimer > 180 + Math.random() * 120) {
                    this.eyeBlink = 1;
                    this.blinkTimer = 0;
                }
                if (this.eyeBlink > 0) {
                    this.eyeBlink -= 0.15;
                }

                // Save previous ground state before resetting
                this.wasOnGround = this.onGround;
                this.wasOnWall = this.onWall;

                // Coyote time - grace period for jumping after leaving platform
                if (this.onGround) {
                    this.coyoteTime = 4; // 4 frames of grace period
                } else if (this.coyoteTime > 0) {
                    this.coyoteTime--;
                }

                // Reset ground/wall state
                this.onGround = false;
                this.onWall = false;

                // Update particles
                this.particles = this.particles.filter(p => {
                    if (p.type === 'shadeTrail') {
                        // Shade trail particles move toward target
                        if (p.delay > 0) {
                            p.delay--;
                        } else {
                            p.x += (p.targetX - p.x) * 0.12;
                            p.y += (p.targetY - p.y) * 0.12;
                        }
                    } else {
                        p.x += p.vx;
                        p.y += p.vy;
                    }
                    p.life--;
                    return p.life > 0;
                });
            }

            createJumpParticles() {
                // Hollow Knight style soul/void burst effect
                // Main soul wisps floating upward
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI + Math.PI; // Spread downward
                    const speed = 1.5 + Math.random() * 1.5;
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 8,
                        y: this.y + this.height,
                        vx: Math.cos(angle) * speed * 0.4,
                        vy: Math.sin(angle) * speed * 0.5 + 0.5,
                        life: 30 + Math.random() * 15,
                        color: '#1a1a2e',
                        type: 'soul'
                    });
                }
                // White/pale soul essence
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 12,
                        y: this.y + this.height - 2,
                        vx: (Math.random() - 0.5) * 2,
                        vy: Math.random() * 1.5 + 0.5,
                        life: 25 + Math.random() * 10,
                        color: this.color,
                        type: 'essence'
                    });
                }
                // Ground dust puff
                for (let i = 0; i < 5; i++) {
                    this.particles.push({
                        x: this.x + this.width / 2 + (Math.random() - 0.5) * 16,
                        y: this.y + this.height,
                        vx: (Math.random() - 0.5) * 4,
                        vy: -Math.random() * 2 - 0.5,
                        life: 20,
                        color: '#888888',
                        type: 'dust'
                    });
                }
            }

            attack() {
                if (this.attackCooldown <= 0 && this.attackTimer <= 0) {
                    this.attackTimer = 15;
                    // Quick Slash reduces cooldown (68% faster = 32% of normal cooldown)
                    this.attackCooldown = hasCharm(this, 'quickSlash') ? 8 : 25;
                    this.parryWindow = 25; // Extended parry window (longer than attack)
                    this.pogoBounced = false; // Reset pogo bounce for new attack
                    if (this.attackDirection === 0) {
                        this.wingFadeSpeed = 5; // Quick fade wings only for horizontal attacks
                    }

                    // Create slash particles based on direction - Hollow Knight style
                    for (let i = 0; i < 8; i++) {
                        let px, py, pvx, pvy;
                        if (this.attackDirection === 1) {
                            // Down attack
                            px = this.x + this.width / 2 + (Math.random() - 0.5) * 20;
                            py = this.y + this.height + 5;
                            pvx = (Math.random() - 0.5) * 4;
                            pvy = Math.random() * 5 + 3;
                        } else if (this.attackDirection === -1) {
                            // Up attack
                            px = this.x + this.width / 2 + (Math.random() - 0.5) * 20;
                            py = this.y - 5;
                            pvx = (Math.random() - 0.5) * 4;
                            pvy = -Math.random() * 5 - 3;
                        } else {
                            // Horizontal attack (flipped when wall sliding)
                            const particleFacing = this.onWall ? -this.facing : this.facing;
                            px = this.x + this.width / 2 + (15 * particleFacing);
                            py = this.y + this.height / 2 + (Math.random() - 0.5) * 20;
                            pvx = (Math.random() * 4 + 2) * particleFacing;
                            pvy = (Math.random() - 0.5) * 3;
                        }
                        this.particles.push({
                            x: px, y: py,
                            vx: pvx, vy: pvy,
                            life: 18,
                            color: '#ffffff',
                            type: 'slash'
                        });
                    }
                }
            }

            handleAttackCollision(otherPlayer) {
                if (this.attackTimer > 0 && otherPlayer.invincibilityFrames <= 0) {
                    // Check if attack hitbox overlaps with other player
                    // Hitbox varies based on attack direction
                    let hitboxX, hitboxY, hitboxWidth, hitboxHeight;

                    // Calculate nail range multiplier from charms (stacks)
                    let nailMultiplier = 1.0;
                    if (hasCharm(this, 'longNail')) nailMultiplier *= 1.15;
                    if (hasCharm(this, 'markOfPride')) nailMultiplier *= 1.25;

                    if (this.attackDirection === 1) {
                        // Down attack (pogo) - hitbox below player, only when moving down
                        if (this.vy <= 0) {
                            // Not moving down, no hitbox
                            return false;
                        }
                        hitboxWidth = 90 * nailMultiplier;
                        hitboxHeight = 50 * nailMultiplier;
                        hitboxX = this.x + this.width / 2 - hitboxWidth / 2;
                        hitboxY = this.y + this.height;
                    } else if (this.attackDirection === -1) {
                        // Up attack - hitbox above player
                        hitboxWidth = 80 * nailMultiplier;
                        hitboxHeight = 30 * nailMultiplier;
                        hitboxX = this.x + this.width / 2 - hitboxWidth / 2;
                        hitboxY = this.y - hitboxHeight;
                    } else {
                        // Horizontal attack - hitbox to the side
                        // When wall sliding, attack goes away from wall
                        const attackFacing = this.onWall ? -this.facing : this.facing;
                        const hitboxRange = 40 * nailMultiplier;
                        hitboxX = this.x + (attackFacing > 0 ? this.width : -hitboxRange);
                        hitboxY = this.y;
                        hitboxWidth = hitboxRange;
                        hitboxHeight = this.height;

                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, segStart, segEnd);
                        ctx.ellipse(0, innerOffsetY, segInnerX, segInnerY, 0, segEnd, segStart, true);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // Bright edge
                    const edgeAlpha = Math.max(0, 1 - (slashProgress - 0.3) * 1.5);
                    if (edgeAlpha > 0) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${edgeAlpha * 0.8})`;
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.ellipse(0, 0, outerRadiusX, outerRadiusY, 0, baseStartAngle, baseEndAngle);
                        ctx.stroke();
                    }

                    ctx.restore();
                } else {
                    // Idle nail position with subtle bob
                    const idleAngle = (this.facing > 0 ? 0.3 : Math.PI - 0.3) + Math.sin(this.animTime * 0.5) * 0.05;
                    this.drawNail(nailBaseX, nailBaseY, idleAngle, isFlashing);
                }

                // Dash afterimage effect
                if (isDashing) {
                    ctx.globalAlpha = 0.3;
                    for (let i = 1; i <= 3; i++) {
                        const ghostX = baseX - this.dashDirection.x * DASH_SPEED * i * 0.5;
                        const ghostY = baseY - this.dashDirection.y * DASH_SPEED * i * 0.3;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.ellipse(ghostX, ghostY - 15, 8 - i, 10 - i, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                // Wall slide particles - stone dust
                if (isWallSliding && this.vy > 0) {
                    if (Math.random() < 0.35) {
                        this.particles.push({
                            x: this.x + (this.wallDirection < 0 ? this.width + 2 : -2),
                            y: this.y + Math.random() * this.height,
                            vx: -this.wallDirection * (Math.random() * 1.5 + 0.5),
                            vy: -Math.random() * 1.5 + 0.5,
                            life: 18,
                            color: '#999999',
                            type: 'dust'
                        });
                    }
                }

                // Label
                ctx.fillStyle = '#1a1a1a';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(this.label, baseX, this.y - offsetY - 10);
            }

            drawNail(x, y, angle, isFlashing) {
                const nailLength = 24;
                const handleLength = 7;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                // Handle - simple dark wrapped handle
                ctx.fillStyle = isFlashing ? '#ffffff' : '#4a4a5a';
                ctx.fillRect(-2.5, -handleLength, 5, handleLength);

                // Nail blade - simple elongated diamond/blade shape
                // The Old Nail is a simple, slightly worn pale blade
                ctx.fillStyle = isFlashing ? '#ffffff' : '#c0c0c8';
                ctx.beginPath();
                ctx.moveTo(-3.5, 0); // Left base
                ctx.lineTo(-3, nailLength * 0.6); // Left edge tapers
                ctx.lineTo(0, nailLength); // Sharp point
                ctx.lineTo(3, nailLength * 0.6); // Right edge
                ctx.lineTo(3.5, 0); // Right base
                ctx.closePath();
                ctx.fill();

                // Blade edge - subtle lighter edge on left
                if (!isFlashing) {
                    ctx.strokeStyle = '#e0e0e8';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-2.5, 2);
                    ctx.lineTo(-2, nailLength * 0.55);
                    ctx.lineTo(0, nailLength - 2);
                    ctx.stroke();
                }

                // Simple crossguard
                ctx.fillStyle = isFlashing ? '#ffffff' : '#6a6a7a';
                ctx.fillRect(-5, -1.5, 10, 3);

                ctx.restore();
            }

            handlePlatformCollision(platform) {
                // Check collision
                if (this.x < platform.x + platform.width &&
                    this.x + this.width > platform.x &&
                    this.y < platform.y + platform.height &&
                    this.y + this.height > platform.y) {

                    // Determine collision direction
                    const overlapLeft = (this.x + this.width) - platform.x;
                    const overlapRight = (platform.x + platform.width) - this.x;
                    const overlapTop = (this.y + this.height) - platform.y;
                    const overlapBottom = (platform.y + platform.height) - this.y;

                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

                    if (minOverlap === overlapTop && this.vy > 0) {
                        // Landing on top
                        this.y = platform.y - this.height;
                        this.vy = 0;
                        this.onGround = true;
                        this.jumpsLeft = getMaxJumps(this);
                        this.dashAvailable = true;

                    } else if (minOverlap === overlapBottom && this.vy < 0) {
                        // Hitting ceiling
                        this.y = platform.y + platform.height;
                        this.vy = 0;
                    } else if (minOverlap === overlapLeft && this.vx > 0) {
                        // Hitting right wall
                        this.x = platform.x - this.width;
                        if (this.dashTimer <= 0) {
                            this.vx = 0;
                            this.onWall = true;
                            this.wallDirection = -1;
                            this.jumpsLeft = getMaxJumps(this);
                            this.dashAvailable = true;
                            this.wingFadeSpeed = 5; // Quick fade wings when wall sliding
                        }
                    } else if (minOverlap === overlapRight && this.vx < 0) {
                        // Hitting left wall
                        this.x = platform.x + platform.width;
                        if (this.dashTimer <= 0) {
                            this.vx = 0;
                            this.onWall = true;
                            this.wallDirection = 1;
                            this.jumpsLeft = getMaxJumps(this);
                            this.dashAvailable = true;
                            this.wingFadeSpeed = 5; // Quick fade wings when wall sliding
                        }
                    }
                }
            }

            handleSpikeCollision(spike) {
                // Extended pogo hitbox to match slash width
                // Calculate nail range multiplier from charms (stacks)
                let nailMultiplier = 1.0;
                if (hasCharm(this, 'longNail')) nailMultiplier *= 1.15;
                if (hasCharm(this, 'markOfPride')) nailMultiplier *= 1.25;
                const pogoSlashWidth = 45 * nailMultiplier;
                const playerCenterX = this.x + this.width / 2;
                const slashHitsSpike = (playerCenterX + pogoSlashWidth > spike.x) &&
                                       (playerCenterX - pogoSlashWidth < spike.x + spike.width) &&
                                       (this.y + this.height > spike.y - 5) &&
                                       (this.y < spike.y + spike.height);

                // Check pogo first with extended slash hitbox
                if (this.attackTimer > 0 && this.attackDirection === 1 && this.vy > 0 &&
                    this.y + this.height - this.vy <= spike.y + 10 && slashHitsSpike) {
                    // Pogo bounce off spikes with downward attack! (only bounce once per attack)
                    if (!this.pogoBounced) {
                        this.vy = -POGO_BOUNCE;
                        this.jumpsLeft = getMaxJumps(this) - 1;
                        this.dashAvailable = true;
                        this.pogoBounced = true;
                    }
                    this.y = spike.y - this.height;
                    this.createJumpParticles();

                    // Create spark particles for hitting spikes
                    for (let i = 0; i < 10; i++) {
                        this.particles.push({
                            x: this.x + this.width / 2,
                            y: spike.y,
                            vx: (Math.random() - 0.5) * 8,
                            vy: -Math.random() * 5 - 2,
                            life: 25,
                            color: '#ffff88'
                        });
                    }
                    return; // Successfully pogoed, don't die
                }

                // Check if player body actually touches spike (death)
                if (this.x < spike.x + spike.width &&
                    this.x + this.width > spike.x &&
                    this.y < spike.y + spike.height &&
                    this.y + this.height > spike.y) {
                    this.die();
                }
            }

            handleVoidZoneCollision(voidZone) {
                if (this.x < voidZone.x + voidZone.width &&
                    this.x + this.width > voidZone.x &&
                    this.y < voidZone.y + voidZone.height &&
                    this.y + this.height > voidZone.y) {
                    // Void instantly kills - no pogo possible
                    this.die();
                }
            }

            handleCheckpoint(checkpoint) {
                if (this.x < checkpoint.x + checkpoint.width &&
                    this.x + this.width > checkpoint.x &&
                    this.y < checkpoint.y + checkpoint.height &&
                    this.y + this.height > checkpoint.y) {
                    this.checkpointX = checkpoint.x;
                    this.checkpointY = checkpoint.y - this.height - 5;
                    checkpoint.activated = true;
                    checkpoint.particleTimer = 25; // Short burst of particles
                }
            }

            handleGoal(goal) {
                if (this.x < goal.x + goal.width &&
                    this.x + this.width > goal.x &&
                    this.y < goal.y + goal.height &&
                    this.y + this.height > goal.y) {
                    if (!gameWon) {
                        gameWon = true;
                        winner = this.label;
                        showWinMessage();
                    }
                }
            }

            die() {
                const deathX = this.x + this.width / 2;
                const deathY = this.y + this.height / 2;

                // Find and remove existing shade from this player, create trail particles
                // Only remove if not already pogoed (playing full animation)
                for (let i = deathAnimations.length - 1; i >= 0; i--) {
                    const shade = deathAnimations[i];
                    if (shade.owner === this.label && !shade.pogoed) {
                        // Create trail particles from old shade to new shade
                        const oldX = shade.x;
                        const oldY = shade.y;
                        const dx = deathX - oldX;
                        const dy = deathY - oldY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const numParticles = Math.min(20, Math.max(4, Math.floor(dist / 40)));
                        for (let j = 0; j < numParticles; j++) {
                            const delay = j * 3; // Stagger the particles
                            this.particles.push({
                                x: oldX + (Math.random() - 0.5) * 20,
                                y: oldY + (Math.random() - 0.5) * 20,
                                targetX: deathX,
                                targetY: deathY,
                                delay: delay,
                                life: 35 + delay,
                                color: '#1a1a2e',
                                type: 'shadeTrail'
                            });
                        }
                        // Remove old shade instantly
                        deathAnimations.splice(i, 1);
                    }
                }

                // Add death animation at death location
                deathAnimations.push({
                    x: deathX,
                    y: deathY,
                    frame: 0,
                    frameTimer: 0,
                    facing: this.facing,
                    alpha: 1,
                    fading: false,
                    delayTimer: 90, // Wait 1.5 seconds (90 frames at 60fps) on first frame
                    pogoed: false, // Only continues animation after being pogoed
                    owner: this.label, // Track which player owns this shade
                    attackTimer: 0, // Shade attack animation timer
                    attackCooldown: 0 // Cooldown between shade attacks
                });

                this.x = this.checkpointX;
                this.y = this.checkpointY;
                this.vx = 0;
                this.vy = 0;
                this.dashTimer = 0;
                this.dashAvailable = true;

                // Hollow Knight style death - void/soul burst
                // Main void explosion
                for (let i = 0; i < 16; i++) {
                    const angle = (i / 16) * Math.PI * 2;
                    const speed = 3 + Math.random() * 3;
                    this.particles.push({
                        x: deathX,
                        y: deathY,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 45,
                        color: '#1a1a2e',
                        type: 'soul'
                    });
                }
                // White mask fragments
                for (let i = 0; i < 10; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 4;
                    this.particles.push({
                        x: deathX + (Math.random() - 0.5) * 10,
                        y: deathY + (Math.random() - 0.5) * 10,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        life: 35,
                        color: this.color,
                        type: 'essence'
                    });
                }
                // Rising soul wisps
                for (let i = 0; i < 8; i++) {
                    this.particles.push({
                        x: deathX + (Math.random() - 0.5) * 20,
                        y: deathY,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -Math.random() * 3 - 2,
                        life: 50,
                        color: '#292938',
                        type: 'soul'
                    });
                }
            }

            draw(cameraOffset = camera) {
                // Draw particles with Hollow Knight style effects
                this.particles.forEach(p => {
                    const alpha = Math.min(1, p.life / 25);
                    const px = p.x - cameraOffset.x;
                    const py = p.y - cameraOffset.y;

                    if (p.type === 'soul') {
                        // Soul/void wisps - soft circular with fade
                        const size = 3 + (1 - alpha) * 2;
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(26, 26, 46, ${alpha * 0.7})`;
                        ctx.fill();
                        // Inner brighter core
                        ctx.beginPath();
                        ctx.arc(px, py, size * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(40, 40, 60, ${alpha})`;
                        ctx.fill();
                    } else if (p.type === 'essence') {
                        // White soul essence - glowing
                        const size = 2 + Math.sin(p.life * 0.3) * 1;
                        ctx.beginPath();
                        ctx.arc(px, py, size + 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.3})`;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                        ctx.fill();
                    } else if (p.type === 'dust') {
                        // Dust particles - small squares
                        const size = 2 + (1 - alpha) * 2;
                        ctx.fillStyle = `rgba(100, 100, 100, ${alpha * 0.6})`;
                        ctx.fillRect(px - size/2, py - size/2, size, size);
                    } else if (p.type === 'slash') {
                        // Attack slash particles
                        const size = 3 * alpha;
                        ctx.beginPath();
                        ctx.arc(px, py, size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                        ctx.fill();
                    } else {
                        // Default particles
                        ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                        ctx.fillRect(px - 2, py - 2, 4, 4);
                    }
                });

                // Draw Knight character
                this.drawKnight(cameraOffset.x, cameraOffset.y);
            }
        }

        // Platform class
        class Platform {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                // Path of Pain style - white stone platforms
                ctx.fillStyle = '#d8d8d8';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                // Dark stone cracks/detail lines
                ctx.strokeStyle = '#4a4a4a';
                ctx.lineWidth = 1;

                // Horizontal crack lines
                if (this.height > 10) {
                    ctx.beginPath();
                    ctx.moveTo(this.x - camera.x, this.y - camera.y + this.height / 2);
                    ctx.lineTo(this.x - camera.x + this.width, this.y - camera.y + this.height / 2);
                    ctx.stroke();
                }

                // Dark border
                ctx.strokeStyle = '#2a2a2a';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                // Inner shadow on top
                ctx.strokeStyle = '#a0a0a0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x - camera.x + 1, this.y - camera.y + 1);
                ctx.lineTo(this.x - camera.x + this.width - 1, this.y - camera.y + 1);
                ctx.stroke();
            }
        }

        // Spike class
        class Spike {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            draw() {
                // Simple gray spikes
                const spikeWidth = 15;
                const numSpikes = Math.ceil(this.width / spikeWidth);

                for (let i = 0; i < numSpikes; i++) {
                    const sx = this.x + i * spikeWidth;

                    // Gray spike fill
                    ctx.fillStyle = '#666666';
                    ctx.beginPath();
                    ctx.moveTo(sx - camera.x, this.y - camera.y + this.height);
                    ctx.lineTo(sx - camera.x + spikeWidth / 2, this.y - camera.y);
                    ctx.lineTo(sx - camera.x + spikeWidth, this.y - camera.y + this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Dark outline
                    ctx.strokeStyle = '#333333';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
        }

        // VoidZone class - kills on contact, cannot be pogoed
        class VoidZone {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.animTime = Math.random() * Math.PI * 2;
                // Pre-generate cloud positions for consistent look
                this.clouds = [];
                for (let i = 0; i < 30; i++) {
                    this.clouds.push({
                        xOffset: Math.random(),
                        yOffset: Math.random() * 0.3,
                        speed: 0.3 + Math.random() * 0.4,
                        size: 30 + Math.random() * 50
                    });
                }
            }

            draw() {
                this.animTime += 0.02;

                // White haze - endless fall effect
                const gradient = ctx.createLinearGradient(
                    this.x - camera.x, this.y - camera.y - 40,
                    this.x - camera.x, this.y - camera.y + 80
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
                gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.4)');
                gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 1)');

                ctx.fillStyle = gradient;
                ctx.fillRect(this.x - camera.x, this.y - camera.y - 40, this.width, this.height + 40);

                // Animated wisps/clouds drifting to create depth
                for (let i = 0; i < this.clouds.length; i++) {
                    const cloud = this.clouds[i];
                    const driftX = Math.sin(this.animTime * cloud.speed + i) * 20;
                    const px = (this.x - camera.x) + cloud.xOffset * this.width + driftX;
                    const py = (this.y - camera.y) + cloud.yOffset * 60 - 20;

                    const alpha = 0.15 + Math.sin(this.animTime * 0.5 + i) * 0.1;
                    ctx.fillStyle = `rgba(230, 235, 240, ${alpha})`;

                    ctx.beginPath();
                    ctx.ellipse(px, py, cloud.size, cloud.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Subtle floating particles falling down (parallax depth effect)
                ctx.fillStyle = 'rgba(200, 210, 220, 0.5)';
                for (let i = 0; i < 15; i++) {
                    const fallSpeed = (this.animTime * (0.5 + i * 0.1)) % 1;
                    const px = (this.x - camera.x) + ((Math.sin(i * 7) * 0.5 + 0.5) * this.width);
                    const py = (this.y - camera.y) - 30 + fallSpeed * 80;
                    const size = 1 + (i % 3);
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Checkpoint class - Hollow Knight style bench
        class Checkpoint {
            constructor(x, y) {
                this.x = x;
                this.y = y + 12; // Offset down to sit on platform
                this.width = 60;
                this.height = 48;
                this.activated = false;
                this.particles = [];
                this.particleTimer = 0; // Timer for temporary particle effect
            }

            draw() {
                const baseX = this.x - camera.x;
                const baseY = this.y - camera.y;

                // Update particle timer - burst effect
                if (this.particleTimer > 0) {
                    this.particleTimer--;
                    // Spawn multiple particles for burst effect
                    const spawnCount = this.particleTimer > 20 ? 5 : 1; // More at start
                    for (let i = 0; i < spawnCount; i++) {
                        if (Math.random() < 0.5) {
                            this.particles.push({
                                x: this.x + this.width / 2 + (Math.random() - 0.5) * 30,
                                y: this.y + 15,
                                vx: (Math.random() - 0.5) * 1.5,
                                vy: -Math.random() * 1.0 - 0.4,
                                life: 20 + Math.random() * 15,
                                size: 4 + Math.random() * 3
                            });
                        }
                    }
                }

                // Update and draw particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy -= 0.01; // Float upward
                    p.life--;

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    const alpha = Math.min(1, p.life / 30);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(p.x - camera.x, p.y - camera.y, p.size * (p.life / 100 + 0.5), 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw bench using sprite if loaded, otherwise fall back to drawn version
                if (benchSprite.loaded) {
                    // Draw the bench image
                    const imgWidth = this.width + 5;
                    const imgHeight = (benchSprite.image.height / benchSprite.image.width) * imgWidth;
                    ctx.drawImage(
                        benchSprite.image,
                        baseX - 2,
                        baseY + this.height - imgHeight,
                        imgWidth,
                        imgHeight
                    );
                } else {
                    // Fallback: drawn bench
                    const mainColor = '#5a5a6a';
                    const darkColor = '#3a3a4a';
                    const highlightColor = '#7a7a8a';

                    // Bench legs (curved)
                    ctx.fillStyle = darkColor;
                    // Left leg
                    ctx.beginPath();
                    ctx.moveTo(baseX + 8, baseY + this.height);
                    ctx.quadraticCurveTo(baseX + 5, baseY + this.height - 15, baseX + 10, baseY + this.height - 20);
                    ctx.lineTo(baseX + 14, baseY + this.height - 20);
                    ctx.quadraticCurveTo(baseX + 12, baseY + this.height - 10, baseX + 14, baseY + this.height);
                    ctx.closePath();
                    ctx.fill();
                    // Right leg
                    ctx.beginPath();
                    ctx.moveTo(baseX + this.width - 8, baseY + this.height);
                    ctx.quadraticCurveTo(baseX + this.width - 5, baseY + this.height - 15, baseX + this.width - 10, baseY + this.height - 20);
                    ctx.lineTo(baseX + this.width - 14, baseY + this.height - 20);
                    ctx.quadraticCurveTo(baseX + this.width - 12, baseY + this.height - 10, baseX + this.width - 14, baseY + this.height);
                    ctx.closePath();
                    ctx.fill();

                    // Bench seat
                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.roundRect(baseX + 5, baseY + this.height - 25, this.width - 10, 8, 2);
                    ctx.fill();
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Seat highlight
                    ctx.strokeStyle = highlightColor;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 7, baseY + this.height - 24);
                    ctx.lineTo(baseX + this.width - 7, baseY + this.height - 24);
                    ctx.stroke();

                    // Backrest
                    ctx.fillStyle = mainColor;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 10, baseY + this.height - 23);
                    ctx.lineTo(baseX + 12, baseY + 8);
                    ctx.quadraticCurveTo(baseX + this.width / 2, baseY, baseX + this.width - 12, baseY + 8);
                    ctx.lineTo(baseX + this.width - 10, baseY + this.height - 23);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Backrest decorative curves
                    ctx.strokeStyle = highlightColor;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(baseX + 15, baseY + this.height - 25);
                    ctx.quadraticCurveTo(baseX + this.width / 2, baseY + 5, baseX + this.width - 15, baseY + this.height - 25);
                    ctx.stroke();

                    // Center ornament on backrest
                    ctx.fillStyle = this.activated ? '#ffffd0' : highlightColor;
                    ctx.beginPath();
                    ctx.arc(baseX + this.width / 2, baseY + 15, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Goal class
        class Goal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 80;
                this.glow = 0;
            }

            update() {
                this.glow = (this.glow + 0.05) % (Math.PI * 2);
            }

            draw() {
                const alpha = 0.5 + Math.sin(this.glow) * 0.3;
                ctx.fillStyle = `rgba(100, 200, 255, ${alpha})`;
                ctx.fillRect(this.x - camera.x - 10, this.y - camera.y, this.width + 20, this.height);

                ctx.fillStyle = '#88ccff';
                ctx.fillRect(this.x - camera.x, this.y - camera.y, this.width, this.height);

                ctx.fillStyle = '#fff';
                ctx.font = '14px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GOAL', this.x - camera.x + this.width / 2, this.y - camera.y + this.height / 2 + 5);
            }
        }

        // Initialize players
        const player1 = new Player(100, 400, '#e0e0e0', {

            jump: 'w',
            down: 's',

        }, 'P2');

        // Control scheme presets
        const p1ControlSchemes = {
            left: { left: 'a', right: 'd', jump: 'w', down: 's', dash: 'shiftleft', attack: 'q', attackAlt: null },
            right: { left: 'a', right: 'd', jump: 'w', down: 's', dash: 'v', attack: 'q', attackAlt: 'control' }
        };

        const p2ControlSchemes = {
            left: { left: 'j', right: 'l', jump: 'i', down: 'k', dash: 'b', attack: 'u', attackAlt: null },

        // Also support Space for P1 and Enter for P2
